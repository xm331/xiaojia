<!DOCTYPE html>
<!-- 小米的第一个项目 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小米的小家">
<meta name="theme-color" content="#16151c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<!-- 真 PWA：manifest 的 href 由脚本动态补 sharecode（本网关不带码会 403） -->
<link rel="apple-touch-icon" href="home.jpg">
<link rel="apple-touch-icon" sizes="192x192" href="home.jpg">
<link rel="icon" type="image/jpeg" href="home.jpg">
<link rel="manifest" id="manifestLink" href="manifest.webmanifest">
<!-- z114：首字提速——提前跟模型接口握手。移动网络冷启动时 TLS 握手要 100~300ms，
     等 fetch 那一刻才开始握手，这段就白等了。crossorigin 必须带，否则建的连接跟 CORS 请求对不上、复用不了。 -->
<link rel="preconnect" href="https://api.siliconflow.cn" crossorigin>
<link rel="dns-prefetch" href="https://api.siliconflow.cn">
<title>小米的小家</title>
<style>

/* ===== 色板：微信浅色（变量名保留以兼容仍在引用的样式） ===== */
:root{
  --bg0:#ededed; --bg1:#f7f7f7; --bg2:#ffffff; --panel:#ffffff; --panelA:rgba(255,255,255,.96);
  --line:#d9d9d9; --lineSoft:#e5e5e5; --lineFaint:#eeeeee;
  --text:#191919; --text2:#4a4a4a; --muted:#9a9a9a; --muted2:#b0b0b0;
  --accent:#07c160; --accent2:#576b95;
  --accentRgb:7,193,96; --accent2Rgb:87,107,149;
  --c-gpt:#7f77dd; --c-claude:#0f6e56; --c-deep:#185fa5;
  --me1:#95ec69; --me2:#95ec69;
  --glow1:#ededed; --glow2:#ededed; --glow3:#ededed; --glow4:#ededed;
  --sh1:0 1px 3px rgba(0,0,0,.06);
  --sh2:0 4px 14px rgba(0,0,0,.1);
  --sh3:0 8px 30px rgba(0,0,0,.14);
  --hairline:inset 0 1px 0 rgba(255,255,255,.7);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:"PingFang SC","Microsoft YaHei","Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",system-ui,sans-serif;
  color:var(--text);overflow:hidden;position:relative;background:var(--bg0);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
/* ===== 主容器 ===== */
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;max-width:900px;margin:0 auto;box-shadow:var(--sh3)}

/* ===== 顶栏 ===== */
#topbar{height:68px;flex:0 0 68px;display:flex;align-items:center;gap:12px;padding:0 20px;
  background:var(--panelA);backdrop-filter:blur(24px);border-bottom:1px solid var(--lineFaint);box-shadow:var(--hairline)}
.groupAvatar{width:44px;height:44px;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,#8c7596,#6f938b);
  display:flex;align-items:center;justify-content:center;font-size:22px;flex:0 0 44px;border:1px solid rgba(255,255,255,.14);box-shadow:var(--sh1),var(--hairline)}
.groupAvatar img{width:100%;height:100%;object-fit:cover}
.groupAvatar{cursor:pointer}
.groupAvatar:hover{filter:brightness(1.15)}
.quiet{color:var(--muted);opacity:.8}
.titles{flex:1;min-width:0}
.gname{font-size:16px;font-weight:700;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.gsub{font-size:11px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px;letter-spacing:.3px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent2);box-shadow:0 0 9px rgba(var(--accent2Rgb),.8);display:inline-block}
.ibtn{width:38px;height:46px;border-radius:14px;border:1px solid var(--lineSoft);background:rgba(255,255,255,.045);color:var(--text2);
  font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 38px;transition:.18s;box-shadow:var(--hairline)}
.ibtn:hover{background:rgba(var(--accentRgb),.16);border-color:var(--accent);color:var(--text);transform:translateY(-1px)}

/* ===== 消息区 ===== */
#chatBox{flex:1;overflow-y:auto;padding:26px 20px 14px;scroll-behavior:smooth}
#chatBox::-webkit-scrollbar{width:6px}
#chatBox::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:6px}
.msg{display:flex;gap:12px;margin-bottom:24px}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg .mavatar{width:48px;height:48px;flex:0 0 48px;border-radius:0;overflow:visible;display:flex;align-items:center;justify-content:center;
  font-size:20px;background:none;border:none}
.msg .mavatar img{width:100%;height:100%;object-fit:cover;border-radius:5px;box-shadow:none;filter:none}
.msg.me .mavatar img{border-radius:5px;filter:none;box-shadow:none}
.msg.me .mavatar{cursor:pointer}
.msg.me .mavatar:hover{filter:brightness(1.35)}
.msg.me .mavatar:hover::after{content:"换";position:absolute;font-size:12px;color:#fff;text-shadow:0 1px 3px #000;pointer-events:none}
.msg .body{max-width:75%;min-width:0}
.msg .meta{font-size:11px;color:var(--muted);margin:0 0 6px 3px;display:flex;align-items:center;gap:6px;letter-spacing:.4px}
.msg .badge{font-size:10px;padding:2px 7px;border-radius:7px;background:rgba(255,255,255,.06);border:1px solid var(--lineSoft);color:var(--muted)}
.msg .bubble{display:inline-block;padding:11px 15px;border-radius:6px 18px 18px 18px;
  background:linear-gradient(150deg,#332f3e,#2b2835);border:1px solid var(--line);
  font-size:14px;line-height:1.7;color:var(--text);word-break:break-word;white-space:pre-wrap;box-shadow:var(--sh1),var(--hairline)}
.msg.who-gpt .meta{color:var(--c-gpt)}
.msg.who-claude .meta{color:var(--c-claude)}
.msg.who-deepseek .meta{color:var(--c-deep)}
.msg.me{flex-direction:row-reverse}
.msg.me .body{display:flex;flex-direction:column;align-items:flex-end}
.msg.me .meta{margin:0 3px 6px 0}
.msg.me .bubble{background:linear-gradient(150deg,var(--me1),var(--me2));border-color:rgba(255,255,255,.12);
  color:#f7f3f8;border-radius:18px 6px 18px 18px;box-shadow:var(--sh1),var(--hairline)}
.msg.system{justify-content:center}
.msg.system .bubble{background:rgba(255,255,255,.035);border:1px solid var(--lineFaint);color:var(--muted2);font-size:11px;letter-spacing:.3px;
  padding:6px 15px;border-radius:20px;text-align:center;white-space:normal;box-shadow:none}
.msg.memory .bubble{background:rgba(var(--accentRgb),.1);border:1px solid rgba(var(--accentRgb),.32);color:var(--accent);font-size:11px;border-radius:20px;text-align:center}
.typingDot{color:var(--muted);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.msg .bubble img{display:block;max-width:100%;border-radius:10px;margin-top:8px}
.msg .bubble video.stickerVid{display:block;max-width:100%;max-height:280px;border-radius:12px;margin-top:8px;background:rgba(0,0,0,.4)}
.msg .bubble img.stickerImg{display:block;max-width:120px;max-height:120px;border-radius:12px;margin-top:6px;object-fit:contain}
.err{color:#dd9292;font-size:12.5px}

/* 头像状态（z82：去掉思考时头像闪烁） */
.msg.spoke .mavatar img{animation:avHop .6s ease}
@keyframes avHop{0%{transform:scale(1)}30%{transform:translateY(-4px) scale(1.14)}65%{transform:translateY(-1px) scale(1.06)}100%{transform:scale(1)}}
.msg.sadav .mavatar img{opacity:.45}
.mavatar{overflow:visible}

/* ===== 输入区 ===== */
#composer{flex:0 0 auto;padding:14px 20px 18px;background:var(--panelA);backdrop-filter:blur(24px);border-top:1px solid var(--lineFaint);box-shadow:var(--hairline)}
#atBar{display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
#atBar .lbl{font-size:11px;color:var(--muted)}
#chips{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.chip{display:flex;align-items:center;gap:5px;padding:4px 11px 4px 4px;border-radius:20px;border:1px solid var(--lineSoft);
  background:rgba(255,255,255,.045);font-size:11.5px;cursor:pointer;transition:.18s;color:var(--text2)}
.chip:hover{border-color:var(--accent);color:var(--text)}
.chip .cdot{width:22px;height:22px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--line);font-size:12px}
.chip .cdot img{width:100%;height:100%;object-fit:cover}
.chip.on{background:rgba(var(--accent2Rgb),.16);border-color:var(--accent2);color:#d2e2d7}
#attachRow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
#attachRow:empty{display:none}
.thumb{position:relative;width:54px;height:54px;border-radius:12px;overflow:hidden;background:rgba(0,0,0,.4);border:1px solid var(--lineSoft);box-shadow:var(--sh1)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .rm{position:absolute;top:0;right:0;width:18px;height:18px;background:rgba(0,0,0,.75);color:#fff;font-size:11px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:0 0 0 10px}
#inputRow{display:flex;gap:10px;align-items:flex-end}
#inputBox{flex:1;min-height:46px;max-height:120px;resize:none;border-radius:15px;border:1px solid var(--line);
  background:var(--bg2);color:var(--text);padding:13px 15px;font-size:14px;font-family:inherit;outline:none;line-height:1.5;
  transition:.18s;box-shadow:inset 0 1px 3px rgba(0,0,0,.22)}
#inputBox:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accentRgb),.14),inset 0 1px 3px rgba(0,0,0,.22)}
#inputBox::placeholder{color:var(--muted2)}
#btnSend{height:46px;flex:0 0 auto;padding:0 24px;border-radius:14px;border:1px solid rgba(255,255,255,.14);cursor:pointer;font-size:14px;font-weight:700;letter-spacing:.5px;
  background:linear-gradient(135deg,#d9b494,#bf9574);color:#2b2018;transition:.18s;box-shadow:0 4px 14px rgba(var(--accentRgb),.26),var(--hairline)}
#btnSend:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 7px 20px rgba(var(--accentRgb),.36),var(--hairline)}
#btnSend:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
#statusLine{font-size:11px;color:var(--accent2);height:14px;margin-top:8px;text-align:center;letter-spacing:.3px}

/* ===== 表情面板 ===== */
#emojiPanel{position:absolute;left:20px;right:20px;bottom:calc(100% + 8px);max-width:520px;margin:0 auto;
  background:linear-gradient(160deg,#312d3b,#25222d);border:1px solid var(--line);border-radius:20px;
  padding:14px 16px 16px;box-shadow:var(--sh3),var(--hairline);z-index:20;display:none}
#emojiPanel.show{display:block}
#emojiPanel .ep-tabs{display:flex;gap:6px;margin-bottom:12px;border-bottom:1px solid var(--lineFaint);padding-bottom:10px}
#emojiPanel .ep-tab{font-size:12px;padding:6px 13px;border-radius:9px;border:1px solid transparent;background:transparent;
  color:var(--muted);cursor:pointer;transition:.15s}
#emojiPanel .ep-tab.on{background:rgba(var(--accentRgb),.16);border-color:rgba(var(--accentRgb),.4);color:var(--accent)}
#emojiPanel .ep-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;max-height:220px;overflow-y:auto}
@media(max-width:520px){#emojiPanel .ep-grid{grid-template-columns:repeat(7,1fr)}}
#emojiPanel .ep-item{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:24px;
  border-radius:10px;cursor:pointer;transition:.12s;user-select:none}
#emojiPanel .ep-item:hover{background:rgba(255,255,255,.1);transform:scale(1.12)}
#emojiPanel .ep-item img{width:100%;height:100%;object-fit:contain;pointer-events:none}
#emojiPanel .ep-item video{width:100%;height:100%;object-fit:cover;pointer-events:none;border-radius:8px}
#emojiPanel .ep-item .vidTag{position:absolute;right:2px;bottom:2px;font-size:9px;background:rgba(0,0,0,.75);color:#fff;padding:0 3px;border-radius:4px}
#emojiPanel .ep-item{position:relative}
#emojiPanel .ep-empty{grid-column:1/-1;text-align:center;color:var(--muted);font-size:12px;padding:22px 8px;line-height:1.7}
#emojiPanel .ep-tip{font-size:11px;color:var(--muted2);margin-top:10px;text-align:center;letter-spacing:.3px}
#btnEmoji{flex:0 0 38px}
@media(max-width:520px){#inputRow{gap:6px}}

/* ===== 弹窗 ===== */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,9,14,.78);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:18px}
.overlay.show{display:flex}
.card{width:100%;max-width:560px;max-height:86vh;overflow-y:auto;background:linear-gradient(160deg,#302c3a,#24212c);
  border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:var(--sh3),var(--hairline)}
.card h2{margin:0 0 6px;font-size:20px;font-weight:700;letter-spacing:.5px}
.card .sub{color:var(--muted);font-size:12.5px;margin-bottom:20px;line-height:1.75}
.card h3{font-size:13px;color:var(--accent2);margin:20px 0 10px;letter-spacing:.5px}
.closeBtn{margin-top:22px;width:100%;padding:13px;border-radius:14px;border:1px solid rgba(var(--accentRgb),.5);
  background:rgba(var(--accentRgb),.16);color:#efd2b6;font-size:13px;cursor:pointer;font-weight:700;letter-spacing:.5px;transition:.18s}
.closeBtn:hover{background:rgba(var(--accentRgb),.26)}
.memCard{border:1px solid var(--lineSoft);border-radius:14px;padding:14px;margin-bottom:12px;background:rgba(255,255,255,.03);box-shadow:var(--hairline)}
.memCard .mh{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.memCard .mh .mavatar{width:32px;height:32px;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--line)}
.memCard .mh .mavatar img{width:100%;height:100%;object-fit:cover}
.memCard .mh .mn{font-weight:700;font-size:13px;flex:1}
.memCard .mh .stat{font-size:10px;color:var(--muted)}
.mini{padding:6px 11px;border-radius:9px;border:1px solid var(--lineSoft);background:rgba(255,255,255,.05);color:var(--text2);font-size:11.5px;cursor:pointer;transition:.18s}
.mini:hover{border-color:var(--accent);color:var(--text)}
.memText{font-size:11.5px;color:var(--muted);line-height:1.75;white-space:pre-wrap;max-height:110px;overflow:auto;background:rgba(0,0,0,.26);padding:11px;border-radius:10px;margin-top:10px}
.setRow{display:flex;align-items:center;gap:9px;margin-bottom:10px;font-size:12.5px}
.setRow label{color:var(--muted);flex:0 0 74px}
.setRow input,.setRow select{flex:1;min-width:0;padding:9px 11px;border-radius:10px;border:1px solid var(--lineSoft);background:var(--bg2);color:var(--text);font-size:12px;font-family:inherit;outline:none}
.setRow input:focus,.setRow select:focus{border-color:var(--accent)}
details.member{border:1px solid var(--lineSoft);border-radius:14px;margin-bottom:12px;background:rgba(255,255,255,.03);overflow:hidden}
details.member summary{padding:12px 14px;cursor:pointer;font-size:13px;font-weight:700;display:flex;align-items:center;gap:10px;list-style:none;letter-spacing:.3px}
details.member summary::-webkit-details-marker{display:none}
details.member .inner{padding:0 14px 14px}
details.member .mavatar{width:30px;height:30px;border-radius:10px;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;background:var(--line)}
details.member .mavatar img{width:100%;height:100%;object-fit:cover}

@media(max-width:520px){
  #topbar{height:60px;flex-basis:60px;padding:0 12px;gap:8px}
  .groupAvatar{width:40px;height:40px;flex-basis:40px}
  #chatBox{padding:20px 12px 8px}
  .msg .body{max-width:80%}
  .card{padding:20px}
  #composer{padding:12px 14px 16px}
  #btnSend{padding:0 17px}
}

/* ===================== z117 微信皮肤覆盖层（只加不删，压在旧样式之上） ===================== */
:root{--wx-bg:#ededed;--wx-panel:#f7f7f7;--wx-line:#d9d9d9;--wx-text:#191919;--wx-muted:#9a9a9a;--wx-green:#07c160;--wx-me:#95ec69}
html,body{background:#ededed!important}
#app{background:#ededed!important;box-shadow:none!important}

/* 外层：列表页在下，聊天页盖在上面，用 translateX 滑入滑出 */
#wxStage{position:relative;width:100%;height:100%;overflow:hidden;background:var(--wx-bg);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
#convList{position:absolute;inset:0;z-index:3;overflow-y:auto;background:var(--wx-bg)}
#chatLayer{position:absolute;inset:0;z-index:4;transform:translateX(100%);transition:transform .28s ease;will-change:transform}
#chatLayer.show{transform:translateX(0)}
.wx-inner{max-width:900px;margin:0 auto;min-height:100%;background:var(--wx-bg)}

/* 会话列表 */
.wx-head{height:60px;display:flex;align-items:center;justify-content:center;position:relative;background:#ededed;border-bottom:.5px solid var(--wx-line)}
.wx-head .wx-title{font-size:17px;font-weight:500;color:var(--wx-text)}
.wx-head .wx-add{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:26px;color:var(--wx-text);line-height:1}
.wx-search{height:36px;margin:8px 12px;border-radius:6px;background:#e4e4e4;display:flex;align-items:center;justify-content:center;color:#9a9a9a;font-size:13px}
.wx-item{display:flex;align-items:center;gap:11px;padding:10px 15px;background:#fff;cursor:pointer;border-bottom:.5px solid #f0f0f0;-webkit-tap-highlight-color:rgba(0,0,0,.08)}
.wx-item:active{background:#dcdcdc}
.wx-item.wx-pinned{background:#f7f7f7}
.wx-av{width:46px;height:46px;flex:0 0 46px;border-radius:5px;overflow:hidden;background:#e5e5e5}
.wx-av img{width:100%;height:100%;object-fit:cover;display:block}
.wx-meta{flex:1;min-width:0}
.wx-name{font-size:16px;color:var(--wx-text);line-height:1.45}
.wx-last{font-size:13px;color:var(--wx-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5}
.wx-time{font-size:11px;color:#b0b0b0;align-self:flex-start;padding-top:3px;flex:0 0 auto}
#btnBroom:active{transform:scale(.88)}
.wx-clear{border:0;background:#fff;color:#e64340;padding:10px 26px;border-radius:8px;font-size:14px;cursor:pointer}
.wx-clear:active{background:#f2f2f2}

/* 微信群四宫格头像 */
.ggrid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:1px;width:100%;height:100%;background:var(--wx-line);border-radius:5px;overflow:hidden}
.ggrid .gc{display:block;overflow:hidden;background:#fff}
.ggrid .gc img{width:100%!important;height:100%!important;object-fit:cover;display:block;border-radius:0!important;box-shadow:none!important;filter:none!important}

/* 聊天页顶栏 */
#topbar{height:56px!important;flex-basis:56px!important;background:#ededed!important;border-bottom:.5px solid var(--wx-line)!important;box-shadow:none!important;padding:0 8px!important;gap:6px!important;position:relative}
#btnBack{width:32px;height:44px;flex:0 0 32px;border:0;background:transparent;color:var(--wx-text);font-size:32px;line-height:1;cursor:pointer;padding:0 0 3px 0}
#topbar .groupAvatar{display:none!important}
#topbar .titles{text-align:center;display:flex;align-items:center;justify-content:center;flex:1}
.gname{font-size:17px!important;font-weight:500!important;color:var(--wx-text)!important;letter-spacing:0!important}
.gsub{display:none!important}
#topbar .ibtn{display:none!important}
.wx-topright{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:8px}
#spendTop{font-size:11px;color:#9a9a9a;white-space:nowrap;font-variant-numeric:tabular-nums}
#btnBroom{width:30px;height:30px;border:0;background:transparent;cursor:pointer;padding:0;font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;filter:grayscale(.35)}
#btnBroom:active{transform:scale(.88)}

/* 聊天气泡 */
#chatBox{background:var(--wx-bg)!important;padding:14px 12px!important}
#chatBox::-webkit-scrollbar-thumb{background:#c8c8c8!important}
.msg{gap:8px!important;margin-bottom:16px!important}
.msg .mavatar{width:40px!important;height:40px!important;flex:0 0 40px!important;background:none!important;border:0!important;font-size:20px!important}
.msg .mavatar img{border-radius:5px!important;box-shadow:none!important;filter:none!important}
.msg .body{max-width:72%!important}
.msg .meta{font-size:11px!important;color:var(--wx-muted)!important;margin:0 0 4px 2px!important;letter-spacing:0!important}

<script>
/* ===== PWA 启动引导（动态补 sharecode，绕开网关 403）===== */
(function(){
  try{
    var m=location.search.match(/[?&]sharecode=([^&]+)/);
    var q=m?("?sharecode="+m[1]):"";
    var ml=document.getElementById("manifestLink");
    if(ml)ml.href="manifest.webmanifest"+q;
    if("serviceWorker" in navigator){
      navigator.serviceWorker.register("sw.js"+q,{scope:"./",updateViaCache:"none"}).catch(function(){});
    }
    // 申请持久化存储：浏览器批准后，系统"清理浏览数据"通常会跳过本站
    if(navigator.storage&&navigator.storage.persist){
      navigator.storage.persist().catch(function(){});
    }
  }catch(e){}
})();
/* 版本号：每次改内容我都会改这个号，页面打开时自动探测更新 */
const APP_VER="1.5.0";
/* ===== 自动更新探测：绕开浏览器缓存，发现新版就自动刷新一次 ===== */
(function(){
  try{
    const done=sessionStorage.getItem("verChecked_"+APP_VER);
    if(done)return;
    sessionStorage.setItem("verChecked_"+APP_VER,"1");
    const base=location.href.split("?")[0];
    const q=location.search||"";
    fetch(base+"?_v="+Date.now()+q.replace(/^\?/,"&"),{cache:"no-store"})
      .then(r=>r.text())
      .then(t=>{
        const m=t.match(/const APP_VER="([^"]+)"/);
        if(m&&m[1]!==APP_VER){ location.reload(true); }
      })
      .catch(()=>{});
  }catch(e){}
})();

/* ===== 接口 ===== */
/* 硅基流动 API 地址（三家默认都走它） */
const SF_URL="https://api.siliconflow.cn/v1";
/* z114：预连接。head 里那条只盖默认域名；万一有人把接口换成自己的代理，这里补一条。
   去重靠 Set，重复调用不产生额外连接。 */
const _preLinked={};
function preconnect(url){
  try{
    const u=new URL(String(url||""));
    if(u.protocol!=="https:"&&u.protocol!=="http:")return;
    const origin=u.origin;
    if(_preLinked[origin])return;
    _preLinked[origin]=1;
    const l=document.createElement("link");l.rel="preconnect";l.href=origin;l.crossOrigin="anonymous";
    (document.head||document.documentElement).appendChild(l);
    const d=document.createElement("link");d.rel="dns-prefetch";d.href=origin;
    (document.head||document.documentElement).appendChild(d);
  }catch(e){}
}
function preconnectMembers(){
  try{(members||[]).forEach(m=>{if(m&&m.url)preconnect(m.url);});}catch(e){}
  preconnect(SF_URL);
}

/* ===== 头像（base64 内嵌，不依赖网络） ===== */
const MY_AVATAR="img:me|me.jpg";
/* 点自己的头像可以换一张：前端裁成方形压到 128×128，只存这台设备，不上传任何服务器 */
const LS_MY_AVATAR="ai_my_avatar_v1";
let myAvatarData="";
try{myAvatarData=localStorage.getItem(LS_MY_AVATAR)||"";}catch(e){}
function myAvatarHTML(){return myAvatarData?avatarHTML(myAvatarData):avatarHTML(MY_AVATAR);}
/* 顶栏那个群头像：自己换过就跟着换成自己的，没换过保持原图 */
function refreshGroupAvatar(){
  try{
    const box=document.getElementById("groupAvatar");
    if(box&&myAvatarData)box.innerHTML=myAvatarHTML();
  }catch(e){}
}
function refreshMyAvatars(){
  try{document.querySelectorAll(".msg.me .mavatar").forEach(el=>{el.innerHTML=myAvatarHTML();});}catch(e){}
  refreshGroupAvatar();
}
function pickMyAvatar(){
  try{
    const inp=document.createElement("input");
    inp.type="file";inp.accept="image/*";
    inp.onchange=()=>{
      const f=inp.files&&inp.files[0];if(!f)return;
      const url=URL.createObjectURL(f);
      const img=new Image();
      img.onload=()=>{
        try{
          const c=document.createElement("canvas");c.width=128;c.height=128;
          const s2=Math.min(img.width||128,img.height||128);
          c.getContext("2d").drawImage(img,(img.width-s2)/2,(img.height-s2)/2,s2,s2,0,0,128,128);
          myAvatarData=c.toDataURL("image/jpeg",0.85);
          try{localStorage.setItem(LS_MY_AVATAR,myAvatarData);}
          catch(e){sysMsg("这张图存不进本地（太大了），换张小图试试");}
          refreshMyAvatars();
          sysMsg("头像换好了，只存在你自己这台设备上。");
        }catch(e){sysMsg("换头像失败："+e.message);}
        URL.revokeObjectURL(url);
      };
      img.onerror=()=>{sysMsg("这张图读不出来，换一张试试");URL.revokeObjectURL(url);};
      img.src=url;
    };
    inp.click();
  }catch(e){sysMsg("换头像失败："+e.message);}
}

/* ===== 关于小米的记忆（注入给三个AI的长期记忆种子） ===== */
const MEM_SEED=""; /* 别人的档案：不内置，第一次打开时聊几句自己长出来 */
/* 作者自己那一格（不带 ?u=）才用的档案：丢了会自动补回来，不会给到别人 */
const OWNER_SEED="";

/* ===== 钥匙 & 常量（钥匙不在源码里，首次打开自己填，只存本机） ===== */
const KEY_STORAGE="ai_key_v1";
const KEY_BAK="ai_key_v1_bak";     // 备份：主存储被清时还能捞回来
let KEY="";
/* 钥匙雷打不动存三处：主存储 + 备份项 + cookie。手机清缓存常常只清 storage 不清 cookie，多一道保险 */
/* IndexedDB：手机清"网站数据/缓存"通常清 localStorage，但 IDB 往往能活下来，多一道保险 */
function idbKv(){return new Promise(res=>{try{const r=indexedDB.open("xiaojia",1);r.onupgradeneeded=()=>{try{r.result.createObjectStore("kv");}catch(e){}};r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);}catch(e){res(null);}});}
function idbSet(k,v){if(typeof indexedDB==="undefined")return;idbKv().then(db=>{if(!db)return;try{db.transaction("kv","readwrite").objectStore("kv").put(v,k);}catch(e){}}).catch(()=>{});}
function idbGet(k){if(typeof indexedDB==="undefined")return Promise.resolve("");return idbKv().then(db=>{if(!db)return"";return new Promise(res=>{try{const q=db.transaction("kv","readonly").objectStore("kv").get(k);q.onsuccess=()=>res(q.result||"");q.onerror=()=>res("");}catch(e){res("");}});}).catch(()=>"");}

function readKeyCookie(){

}

/* 人设抽签：权重全部对等，21 张牌各 1 份（各约 4.8%），一碗水端平 */
function drawRP(mode){
  /* mode="chain"：接龙只抽"能接话"的牌；mode="soft"：他状态不高时只抽"能好好说话"的牌 */
  const list0=(mode==="chain")?RPPOOL.filter(r=>r.chainOk):(mode==="soft")?RPPOOL.filter(r=>r.softOk):RPPOOL;
  const list=list0.length?list0:RPPOOL;
  let total=0;list.forEach(r=>total+=(r.weight||1));
  let x=Math.random()*total;
  for(const r of list){x-=(r.weight||1);if(x<0)return r;}
  return list[list.length-1];
}

/* z72：给模型一批候选梗自己判断——先按用户这句话做语义预筛（说得上的排前面），再随机补足；模型自己挑，不贴就不甩 */
function pickMemeCandidates(text,exclude,n){
  const s=String(text||"");
  const recent=recentMemes.slice(-12);
  const base=sharedMemes.filter(x=>(exclude||[]).indexOf(x)<0);
  /* 语义预筛：把用户这句话里的词（2字以上）跟梗文本比对，命中的排前面 */
  const words=[];
  for(let i=0;i<s.length-1;i++){
    const w=s.slice(i,i+2);
    if(/[\u4e00-\u9fa5a-zA-Z0-9]/.test(w[0])&&!/[，。！？、\s]/.test(w))words.push(w);
  }
  const scored=base.map(m=>{
    let sc=0;
    const ks=MEME_KEYS[m];
    if(ks&&ks.length){
      /* z115：有标注的梗只认关键词。命中一个 +6，压过字面重合；一个不沾就是 0 分，不靠字面硬凑 */
      for(const k of ks){if(k&&s.indexOf(k)>=0)sc+=6;}
    }else{
      /* 没标注的（小米自己加的梗）：退回原来的二字重合 */
      for(const w of words){if(m.indexOf(w)>=0)sc+=2;}
    }
    if(recent.indexOf(m)>=0)sc-=3;   /* 最近用过的压后 */
    return {m,sc};
  });
  scored.sort((a,b)=>b.sc-a.sc);
  const picked=[];
  /* z112：只给沾边的，一条都不沾就一条都不给。
     以前不够 6 条就随机补满——他说「好悠哉啊」，梗库里一个字都不沾，塞进去的全是随机的，
     「姐妹们我看到梅姨啦」就是这么跑出来的，模型看见候选里有，就一定会硬接。
     现在宁可不玩梗，也不给不相关的东西。逐字对上的才算，上限 3 条。 */
  for(const o of scored){if(o.sc>0&&picked.length<Math.min(n||3,3)){picked.push(o.m);}}
  /* B3修复：把这次选中的记进 recentMemes，跨轮防重复才真正生效 */
  picked.forEach(c=>{if(recentMemes.indexOf(c)<0)recentMemes.push(c);});
  if(recentMemes.length>24)recentMemes=recentMemes.slice(-24);
  try{localStorage.setItem(LS_MEMES+"_recent",JSON.stringify(recentMemes));}catch(e){}
  return picked;
}
/* z108：表情包清单以前 16 个全塞进提示词（648 字，占一轮三分之一）。
   现在前端先按他这句话挑 6 个贴题的（跟挑梗一个思路：二字词重合打分），再让模型从这 6 个里选一个用。 */
function pickPackCandidates(text,n){
  n=n||6;
  const s=String(text||"");
  const words=[];
  for(let i=0;i<s.length-1;i++){
    const w=s.slice(i,i+2);
    if(/[\u4e00-\u9fa5]/.test(w[0])&&!/[，。！？、\s]/.test(w))words.push(w);
  }
  const scored=CUSTOM_PACK.map((p,i)=>{
    let sc=0;
    const ks=PACK_KEYS[p.file];
    if(ks&&ks.length){
      for(const k of ks){if(k&&s.indexOf(k)>=0)sc+=6;}   /* z115：关键词优先 */
    }else{
      for(const w of words){if(String(p.hint||"").indexOf(w)>=0)sc+=2;}
    }
    return {p,i,sc};
  });
  scored.sort((a,b)=>b.sc-a.sc);
  const hit=scored.filter(x=>x.sc>0).slice(0,n);
  const rest=scored.filter(x=>x.sc<=0);
  const picked=hit.slice();
  while(picked.length<n&&rest.length){
    picked.push(rest.splice(Math.floor(Math.random()*rest.length),1)[0]);
  }
  picked.sort((a,b)=>a.i-b.i);   /* 按原顺序排回去，{{eN}} 编号才对得上图 */
  return picked;
}

/* z108：记忆是"· 一条一句"的文本，以前超长直接 slice(0,N) —— 会从半句话中间切断
   （"他喜欢喝冰美式，不加"）。改成按整条给：宁可少一条，也不给断句。 */
function clipMem(txt,limit){
  const s=String(txt||"");
  if(s.length<=limit)return s;
  const lines=s.split("\n");
  let out="";
  for(const l of lines){
    if((out?out+"\n":"").length+l.length>limit)break;
    out=out?out+"\n"+l:l;
  }
  return out||s.slice(0,limit);
}

function trimHist(m,max){
  max=max||10;
  if(!m||!Array.isArray(m.history)||m.history.length<=max)return;
  const drop=m.history.splice(0,m.history.length-max);
  const said=drop.filter(h=>h.role==="user")
    .map(h=>String(h.content||"").replace(/\s+/g," ").trim().slice(0,24))
    .filter(Boolean);
  if(!said.length)return;
  if(privateWith&&m===privateWith){
    /* 私聊：摘要只留在这一条线上，绝不混进群聊 */
    m.gist=((m.gist||"")+"；"+said.join("；")).replace(/^；+/,"").slice(-140);
  }else{
    addGist(said);   /* 群聊：三个人共一份，不再各滚各的 */
  }
}

/* ===== z137：不可解检测 =====
   「噜啦啦」「啊啊啊」「嘿嘿嘿」「嗯嗯」这类——纯拟声、纯语气词、没头没尾。
   他就是随口发癫，不是让你猜谜语。以前这种话模型会硬往里套意思（"这是洗澡还是唱歌呢？"），
   现在前端先判一道：判不出来就明确告诉模型"这看不懂，只准扣问号或陪他发癫"。

   判定思路：把话拆开，看里面有没有「真正在表达什么」的实词。
   「哈哈哈」有实词（笑/哈）→ 他真在笑，不算不可解；
   「啊啊啊」全是语气词 → 不可解；
   「噜啦啦」全是拟声 → 不可解。 */
const NZ_PARTICLE="啊哦呀嘛呢吧咯嘞呗啦噢喔呜唔额呃嗷诶欸呦唷咪哼噫耶";
/* z137：笑声（哈哈/嘿嘿/嘻嘻）不在这里——它是真实表达，不算"看不懂" */
const NZ_SOUND="噜啦啦叽歪嘞个耶嗷呜呵呵吼吼咩咿嚯";
/* z137：笑声 + 应声类。
   「哈哈哈」= 他真在笑；「嗯嗯」= 他在应声。都是真实表达，不该触发"看不懂"。
   但「嗷呜」「额」这种是纯拟声/纯语气，不在里面 → 判不可解。 */
const NZ_LAUGH="哈嘿嘻吼呵嗯";
const NZ_REAL=["我","你","他","她","咱","的","了","是","在","有","和","就","不","人","都","说","要","会","能","好","没","很","这","那","吃","喝","玩","睡","钱","家","学","工","班","爱","恨","想","打","看","听","买","卖","走","跑","哭","笑","烦","累","饿","困","冷","热","疼","爽","牛","烂","垃圾","面","里","上","下","个","点","天","年","月","日","手","头","心","事","觉","得",
  /* z137：补一批真人口语，防止误判成"看不懂" */
  "无聊","草","哈哈","666","滚","靠","扯","溜","绝","服","憋","抖","憨","懵","晕","挨","整","搞","弄","怼","撩","卷","摆","躺","苟","划","扯淡","别","快","慢","早","晚","多","少","全","挺","老","真","假","对","错","行","得","过","起","来","出去","回来","走开","等等","好多","一点","有点","特别","妈的","滚蛋","神经病","有病","没事"];
function isNonsense(t){
  const s=String(t||"").trim();
  if(!s)return false;
  /* 去掉空白、标点、emoji，只剩"内容" */
  const bare=s.replace(/[\s]/g,"").replace(/[，。！？!?、~～…\.\,\;；:："'"''（）()\[\]【】\-—_]/g,"").trim();
  if(!bare)return true;                                    /* 只有标点 */
  if(/^[\p{Extended_Pictographic}\p{Emoji_Presentation}\u200d️]+$/u.test(bare))return true;
  /* 剥掉语气词和拟声词，看还剩什么 */
  let core=bare;
  for(const ch of NZ_PARTICLE)core=core.split(ch).join("");
  for(const ch of NZ_SOUND)core=core.split(ch).join("");
  core=core.trim();
  /* z137：笑声/应声单独出现（「哈哈哈」「嗯嗯」「哦哦」）算他真在笑、真在应声，不是看不懂。
     判据：原文每个字都在笑声类字里（哈嘿嘻呵吼哦嗯嗷呜额…）。
     「哈哈哈你笑什么」后面有实词，下面 hasReal 那步会放行。 */
  if([...bare].every(ch=>NZ_LAUGH.indexOf(ch)>=0))return false;   /* bare 的每个字都在笑声类里 */
  if(!core)return true;                                   /* 全是语气词/拟声 → 不可解 */
  const hasReal=NZ_REAL.some(w=>core.indexOf(w)>=0);
  if(hasReal)return false;                                /* 有实词 → 他真在说话 */
  /* z137：没有实词，但剥掉语气/拟声后还剩下东西 → 那是内容，不是废话 */
  if(core.length>=2)return false;
  if(bare.length<=6)return true;                          /* 没有实词且很短 → 发癫/乱码 */
  return false;
}

/* ============================================================
   z127 · 主动关心（抄群相「待跟进 + 空窗延续」）
   你说了要去做什么 → 记下来；下次隔够久回来 → 一个人先开口问你。
   不碰 sharedMem/longMem/gist/人设/梗库，独立 localStorage。
   ============================================================ */
const PENDING_RE=/(面试|笔试|考试|体检|复查|看医生|去医院|答辩|述职|约了|约好|等结果|等通知|等回复|交材料|办手续|取报告|拿结果|去(办|交|拿|取|面|考))/;
/* z128：按话里的时间词估一个"该有结果"的时间点（相对时间换算成绝对时间，思路抄 lingshu 记忆系统） */
function estimateDueAt(text,now){
  const d=new Date(now||Date.now());
  if(/后天/.test(text)){const t=new Date(d);t.setDate(t.getDate()+2);t.setHours(10,30,0,0);return t.getTime();}
  if(/明天|明儿|明早|明天再/.test(text)){const t=new Date(d);t.setDate(t.getDate()+1);t.setHours(10,0,0,0);return t.getTime();}
  if(/今晚|晚上|下午|傍晚/.test(text)){const t=new Date(d);t.setHours(19,30,0,0);if(t.getTime()<=now)t.setDate(t.getDate()+1);return t.getTime();}
  if(/等下|一会儿|一会|待会|等会|这就去|马上|这就|现在就去/.test(text))return now+90*60*1000;   /* 一会儿就办的事，一个半小时后该有信儿 */
  return now+4*3600*1000;   /* 默认：比如"去面试了"，4小时后差不多该有结果 */
}
function notePendingFollowup(text,srcWho){
  if(!text||typeof text!=="string")return;
  if(!PENDING_RE.test(text))return;
  if(!/\b(我|咱|要去|明天|今天|下午|等下|准备去|等会|这就去|待会)/.test(text)&&!/要去|准备去|明天|等结果|等通知/.test(text))return;
  let arr=[];try{arr=JSON.parse(localStorage.getItem(LS_PENDING)||"[]");}catch(e){}
  if(!Array.isArray(arr))arr=[];
  const now=Date.now(),clean=text.slice(0,60);
  /* 同一件事24小时内不重复记 */
  if(arr.some(x=>x&&x.text===clean&&now-(x.at||0)<24*3600*1000))return;
  /* z138：出处。private=私聊里说的，who=跟谁说的——回访只走这条私聊线，绝不进群聊 */
  const src=srcWho?"private":"group";
  const who=srcWho?String(srcWho.name||""):"";
  arr.push({text:clean,at:now,dueAt:estimateDueAt(text,now),asked:false,src:src,who:who});
  if(arr.length>20)arr=arr.slice(-20);
  try{localStorage.setItem(LS_PENDING,JSON.stringify(arr));}catch(e){}
}

  let arr=[];try{arr=JSON.parse(localStorage.getItem(LS_PENDING)||"[]");}catch(e){}

/* ===== z129：旧事重提（callbacks）——小米分享过的事，过阵子像朋友没来由想起一样顺嘴提一句 =====
   只存他的原话，绝不编造；跟待跟进互斥（一次开页最多一条主动消息），独立 localStorage。 */
const LS_CB="ai_callbacks_v1";
const CB_RE=/(最近在玩|最近在追|最近在看|在玩|开始玩|入坑|买了|入手了|种草|在看|在追|在学|想去|打算去|喜欢上了|迷上|去吃|吃到|看了|玩完|考完|看完)/;
function noteCallback(text,srcWho){
  if(!text||typeof text!=="string")return;
  if(!CB_RE.test(text))return;
  if(!/我|咱|终于/.test(text))return;   /* 得是他自己的事，不是转述 */
  if(PENDING_RE.test(text))return;      /* 待跟进类走待跟进通道，别两头记 */
  let arr=[];try{arr=JSON.parse(localStorage.getItem(LS_CB)||"[]");}catch(e){}
  if(!Array.isArray(arr))arr=[];
  const now=Date.now(),clean=text.slice(0,60);
  if(arr.some(x=>x&&x.text===clean&&now-(x.at||0)<48*3600*1000))return;   /* 同一件事两天内不重复记 */
  /* z138：出处同上——私聊里说的事只在私聊里旧事重提 */
  const src=srcWho?"private":"group";
  const who=srcWho?String(srcWho.name||""):"";

/* ===== z94：全局播放队列 =====
   三个模型仍然同时思考（三个请求同一瞬间并发），但谁先想好谁先说——不排座次、不轮转。
   所有句子进同一条播放线，严格按到达顺序一条一条蹦，句间留呼吸感：
   没人能一口气把三条糊在你脸上，也不会有人因为"轮不到"而被按着头等前面的人说完。
   一直不换行的长段落仍退回逐字打字机——此时该角色像"正在输入"，别人照常发言。 */
const groupPlayer={views:{},order:[],pumping:false,waiters:[],lineup:[],spoken:[],played:[]};
function groupDupNorm(x){return String(x).replace(/[，。！？!?,.、～~\s]/g,"");}
function groupIsDup(txt){
  const x=groupDupNorm(txt);if(!x)return false;
  const spoken=groupPlayer.spoken||(groupPlayer.spoken=[]);
  return spoken.some(y=>{
    const z=groupDupNorm(y);if(!z)return false;
    if(x===z)return true;
    if(x.length<=6||z.length<=6)return x.indexOf(z)>=0||z.indexOf(x)>=0;   /* 短句互相包含也算撞 */
    return false;
  });
}
function groupReset(names){
  groupPlayer.views={};groupPlayer.order=names.slice();
  groupPlayer.pumping=false;groupPlayer.waiters=[];groupPlayer.lineup=[];groupPlayer.spoken=[];groupPlayer.played=[];
}
function groupAllDone(){
  if(groupPlayer.lineup.length)return false;
  return groupPlayer.order.every(k=>{
    const v=groupPlayer.views[k];
    return !v||v._done;   /* 还没进场的角色不拖住全场：插队台词在等门闩，不能把起头的人卡死 */
  });
}
function groupNext(){
  return groupPlayer.lineup.length?groupPlayer.lineup.shift():null;   /* 先到先得，谁先想好谁先说 */
}
function groupPump(){
  if(groupPlayer.pumping)return;
  const it=groupNext();
  if(!it){
    if(groupAllDone()&&groupPlayer.waiters.length){
      const ws=groupPlayer.waiters;groupPlayer.waiters=[];ws.forEach(w=>w());
    }
    return;
  }
  groupPlayer.pumping=true;
  it.view._render(it.txt);
  setTimeout(()=>{groupPlayer.pumping=false;groupPump();},200+Math.random()*180);
}
function groupEnqueue(key,txt,view){
  groupPlayer.views[key]=view;   /* 双保险：就算构造后被 reset，入队时重新认领 */
  if(!view._allow&&groupIsDup(txt))return;   /* 同轮撞车——后面想出同样话的人闭嘴；抽中应声虫等复读牌的角色豁免 */
  groupPlayer.spoken.push(txt);
  groupPlayer.lineup.push({txt,view});
  groupPump();
}
function groupDrain(){
  if(groupAllDone()&&!groupPlayer.pumping){
    if(groupPlayer.waiters.length){const ws=groupPlayer.waiters;groupPlayer.waiters=[];ws.forEach(w=>w());}
    return Promise.resolve();
  }
  return new Promise(r=>{groupPlayer.waiters.push(r);groupPump();});
}
/* z107：模型有时候一口气写一长段不带换行，全堆在一个大气泡里。
   这里把超过 18 字的一段按句末标点再拆开，一句一条，更像微信连发。 */
function splitLong(txt,n){
  n=n||18;
  const t=String(txt||"").trim();
  if(!t)return [];
  if(t.length<=n)return [t];
  const raw=t.match(/[^。！？!?；;…]+[。！？!?；;…]*/g)||[t];
  const out=[];let cur="";
  for(let i=0;i<raw.length;i++){
    const p=raw[i];
    if(p.length>n*2){              /* 单句太长又没标点 → 再按逗号拆 */
      if(cur){out.push(cur);cur="";}
      const cs=p.match(/[^，,、]+[，,、]*/g)||[p];
      let c2="";
      for(let k=0;k<cs.length;k++){
        if(!c2)c2=cs[k];
        else if((c2+cs[k]).length<=n)c2+=cs[k];
        else{out.push(c2);c2=cs[k];}
      }
      if(c2)cur=c2;
      continue;
    }
    if(!cur)cur=p;
    else if((cur+p).length<=n+8)cur+=p;
    else{out.push(cur);cur=p;}
  }
  if(cur)out.push(cur);
  return out.length?out:[t];
}
function makeStreamView(m,lazy,key,allowDup){
  let buf="",typing=false,born=Date.now(),shown=0,lastSh=null;
  function nextSh(){
    if(!lastSh){lastSh=lazy.ensure();}
    else{lastSh=aiMsgShell(m);lastSh.el.classList.add("spoke");setTimeout(()=>lastSh.el.classList.remove("spoke"),750);}
    return lastSh;
  }
  function typeIt(full){
    const sh=lazy.ensure();
    sh.bubble.innerHTML=renderMdLite(String(full).split("\n")[0])+'<span class="typingDot">…</span>';
    scrollBottom();
  }
  const view={
    get sent(){return !!lastSh;},   /* 已经蹦出过气泡了：被打断时别把说出的话收回去 */
    _done:false,
    _allow:!!allowDup,   /* 抽中复读类牌（应声虫）时同轮撞句不丢——复读就是他的戏 */
    _render(txt){
      const sh=nextSh();
      sh.bubble.innerHTML=renderMdLite(txt);
      (groupPlayer.played||(groupPlayer.played=[])).push({n:key,t:String(txt)});   /* z111：真播到屏幕上的才算数 */
      scrollBottom();
    },
    push(partial){
      const full=String(partial||"");
      if(typing){typeIt(full);return;}
      buf=full;
      const lines=full.split("\n");
      const doneLines=/\n\s*$/.test(full)?lines.length:lines.length-1;
      let segs=lines.slice(0,Math.max(0,doneLines)).map(x=>x.trim()).filter(Boolean);
      segs=segs.reduce((a,x)=>a.concat(splitLong(x)),[]);   /* z107：长段落自动拆成一条一句 */
      while(shown<segs.length){groupEnqueue(key,segs[shown],view);shown++;}
      if(!shown&&Date.now()-born>800){typing=true;typeIt(full);}   /* 0.8秒还没吐出第一整句 → 退回打字机（提前冒头） */
    },
    async finish(full){
      if(typing){
        const sh=lazy.ensure();
        sh.bubble.innerHTML=renderMdLite(String(full||buf));
        (groupPlayer.played||(groupPlayer.played=[])).push({n:key,t:String(full||buf)});   /* z111：打字机模式同样记账 */
        scrollBottom();this._done=true;groupPump();return sh;
      }
      const src=(full===undefined||full===null)?buf:String(full);
      let segs=src.split(/\n+/).map(x=>x.trim()).filter(Boolean);
      segs=segs.reduce((a,x)=>a.concat(splitLong(x)),[]);   /* z107：收尾也拆，长句不留大气泡 */
      this._done=true;
      if(segs.length){
        while(shown<segs.length){groupEnqueue(key,segs[shown],view);shown++;}
        await groupDrain();   /* 等全队播完：一条一条蹦的节奏就来自这里 */
      }else{
        groupPump();   /* 一句都没入队（空回复/全被查重丢掉）也要叫醒等着的人，否则卡死 */
      }
      return lastSh;   /* 一句都没播出来（被同轮查重丢光）→ 返回 null，不建空气泡 */
    }
  };
  groupPlayer.views[key]=view;
  return view;
}
function renderMdLite(t){
  let s=esc(t);
  s=s.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
  s=s.replace(/`([^`]+)`/g,'<code style="background:#0e1122;padding:1px 5px;border-radius:5px;font-size:12px;color:var(--accent2)">$1</code>');
  /* AI 写的隐藏表情标记 {{eN}} -> 真表情包；认不出就抹掉，不把标记露出来 */
  s=s.replace(/\{\{e(\d+)\}\}/g,(full,n)=>{
    const p=CUSTOM_PACK[parseInt(n,10)-1];
    if(!p)return "";
    const u=scSuffix("emojis/"+p.file);
    const kind=p.type||stickerKind(p.file);
    return kind==="video"
      ? `<video class="stickerVid" src="${u}" autoplay loop muted playsinline></video>`
      : `<img class="stickerImg" src="${u}" alt="">`;
  });
  return s;
}

/* z143：按【她自己写的回复】去表情库挑一个贴上来——不再让模型吐标记、不再掷骰子。
   规则：必须关键词硬命中才贴（PACK_KEYS 命中 +6 分，name/hint 二字词命中 +1 分，满 3 分才用），
   命中 0 就一个都不贴。贴不贴由关键词表说了算——小米填得越全，贴得越准。
   不思考档(lv0)不贴——秒回要快；正经事(heartfelt)不贴——保持分寸。 */
function pickStickerByReply(replyText,o){
  o=o||{};
  const lv=(o.lvRef&&typeof o.lvRef.v==="number")?o.lvRef.v:(typeof o.lv==="number"?o.lv:0);
  /* z144: no-think replies are too short to match - use the user's text instead */
  if(o.heartfelt||!CUSTOM_PACK.length)return null;
  const s=String((lv===0&&o.userText)?o.userText:replyText||"");if(!s)return null;
  const words=[];
  for(let i=0;i<s.length-1;i++){
    const w=s.slice(i,i+2);
    if(/[\u4e00-\u9fa5]/.test(w[0])&&!/[，。！？、\s]/.test(w))words.push(w);
  }
  let best=null,bestSc=0;
  CUSTOM_PACK.forEach((p,i)=>{
    let sc=0;
    const ks=PACK_KEYS[p.file]||[];
    for(const k of ks){if(k&&s.indexOf(k)>=0)sc+=6;}
    if(!sc){
      const hay=String(p.name||"")+String(p.hint||"");
      for(const w of words){if(hay.indexOf(w)>=0)sc+=1;}
    }
    if(sc>bestSc){bestSc=sc;best={p:p,i:i};}
  });
  return bestSc>=3?best:null;
}

function insertAtCursor(txt){

  const s=box.selectionStart,e=box.selectionEnd;
  box.value=box.value.slice(0,s)+txt+box.value.slice(e);
  const pos=s+txt.length;box.focus();box.setSelectionRange(pos,pos);

/* 按扩展名判断表情类型：视频走真播放+抽帧，gif/图片走 dataUrl */
function stickerKind(file){
  const f=String(file||"").toLowerCase();
  if(/\.(mp4|webm|ogv|ogg|mov|m4v)$/.test(f))return "video";
  if(/\.gif$/.test(f))return "gif";
  return "image";
}
/* 表情包发出去：你看到的是会动的视频/动图，AI 收到的是抽帧图片（它看不了动态视频） */
async function sendSticker(p){
  const url=scSuffix("emojis/"+p.file);
  const kind=p.type||stickerKind(p.file);
  const panel=document.getElementById("emojiPanel");if(panel)panel.classList.remove("show");
  try{
    const resp=await fetch(url);if(!resp.ok)throw new Error("HTTP "+resp.status);
    const blob=await resp.blob();
    if(kind==="video"){
      const file=new File([blob],p.file,{type:blob.type||"video/mp4"});
      const frames=await videoFrames(file);   // 抽 3 帧给 AI 看懂内容
      attachments.push({type:"stickerVideo",url,frames,name:p.name||p.file});
    }else{
      const dataUrl=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(blob);});
      attachments.push({type:"image",dataUrl,name:p.name||p.file});  // gif 的 dataUrl 在 img 里原生就动
    }
    send();   // 手动发表情：干净地只发图片，不往输入框塞任何词
  }catch(err){sysMsg("表情包没读到："+esc(err.message));}
}

/* ===== 调模型（共享记忆 + 玩梗从库里随机挑） ===== */
/* ===== z141：三人干活模式（纯前端，不接云电脑/后端） =====
   重度档 + 他明确说"做个网页/PPT/幻灯片" → 三人分工产出一个能下载的单文件。
   稳字优先：不让三个人各写一段代码再拼（拼必炸），而是
   ① 主脑先定规格 → ② 三人各出一整版 → ③ 挑最完整的一版 → ④ 前端下载。
   产出 .html（网页）或 .html 翻页幻灯片——手机浏览器直接开，比 pptx 稳。 */
const BUILD_RE=/(做|写|搞|来|生成|帮(我)?做|帮(我)?写).{0,10}(网页|网站|页面|ppt|PPT|幻灯片|演示稿|幻灯片|slide|html|落地页|小工具|小程序页面)/;
function buildKind(text){
  const t=String(text||"");
  if(/ppt|PPT|幻灯片|演示稿|slide/i.test(t))return "slides";
  return "web";
}
/* 从模型回复里扒出代码块——模型爱裹 ```html ```，也可能直接吐裸代码 */
function stripCodeFence(t){
  let x=String(t||"").trim();
  x=x.replace(/^```[a-zA-Z]*\s*\n?/,"").replace(/\n?```\s*$/,"").trim();
  /* 有的会在代码前后加一句"好的，这是你要的网页：" → 掐掉到 <!DOCTYPE/<html 之前 */
  const i=x.search(/<!DOCTYPE|<html|<style|<body/i);
  if(i>0)x=x.slice(i);
  return x.trim();
}
function looksLikeHTML(t){
  const x=String(t||"");
  return /<html|<!DOCTYPE|<body|<style/i.test(x)&&x.length>200;
}
function downloadText(filename,text,mime){
  try{
    const blob=new Blob([text],{type:(mime||"text/html")+";charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download=filename;
    document.body.appendChild(a);a.click();
    setTimeout(()=>{try{a.remove();URL.revokeObjectURL(url);}catch(e){}},4000);
    return true;
  }catch(e){return false;}
}
async function runBuildMode(text,myRun){

      : "你是做网页的。按下面的规格，直接输出**一整个单文件 HTML**：<!DOCTYPE html> 开头，CSS 用 <style> 内联，JS 用 <script> 内联，不引用任何外部文件/图片/CDN（要图就用 emoji 或 CSS 画）。要好看、手机上也好看。**只输出 HTML 代码本身，一个字解释都不要，不要 ``` 代码块标记。**";

      winnerName="兜底版";

      const pre=document.createElement("pre");
      pre.style.cssText="white-space:pre-wrap;word-break:break-all;max-height:220px;overflow:auto;font-size:11px";

}

async function callModelNoRepeat(m,userText,atts,ctx,onChunk){
  const r=await callModel(m,userText,atts,ctx,onChunk);   /* z101：以前这里漏传了 onChunk，等于整段说完才显示 */
  if(!String(r||"").trim())throw new Error("模型没返回内容（可能思考占了字数上限，或内容被过滤）");
  recentReplies.push(r.trim());if(recentReplies.length>12)recentReplies=recentReplies.slice(-12);
  return r;
}
async function callModel(m,userText,atts,ctx,onChunk){
  const url=(m.url||"").replace(/\/+$/,"")+"/chat/completions";
  const pk=String(m.avatar||"").slice(4).split("|")[0];
  const heartfelt=!!(ctx&&ctx.heartfelt);
  /* z137: meme switch - use ctx value when provided */
  const noMeme=(ctx&&typeof ctx.noMeme==="boolean")?ctx.noMeme:heartfelt;
  const persona=(heartfelt?SERIOUS_PERSONA[pk]:PLAY_PERSONA[pk])||m.persona||"你是群聊成员，回复简短有个性。";
  /* ===== z88：提示词分块，顺序也是性能 =====
     固定前缀（人设 → 总规矩 → 场景规则 → 表情 → 记忆）放最前、每轮不变；
     每轮都在变的（别重复 / 候选梗 / 最后一句 / 私聊标记）统一挪到最后。
     前缀稳定 = 供应商的上下文缓存能命中，prefill 少算一大半，首字更快，还省钱。 */
  const messages=[{role:"system",content:persona}];
  messages.push({role:"system",content:RULE_CORE});
  /* z137: tone rules always on - this is the root of "not human" */
  messages.push({role:"system",content:RULE_TONE});
  const isChain=!!(ctx&&ctx.chain);
  const isPrivate=!!(ctx&&ctx.private);
  /* z137: level semantics. 0=reply 1=read-context 2=advise 3=do-the-job.
     Read ctx.lvRef (shared per turn), not global thinkLevel, so replies that
     have not been sent yet pick up the new level. */
  const lvNow=(ctx&&ctx.lvRef&&typeof ctx.lvRef.v==="number")?ctx.lvRef.v
        :(typeof thinkLevel!=="undefined"?thinkLevel:(heartfelt?2:0));
  if(lvNow>=3)messages.push({role:"system",content:RULE_LV3});
  else if(lvNow===2)messages.push({role:"system",content:RULE_LV2});
  else if(lvNow===1)messages.push({role:"system",content:RULE_LV1});
  /* z139: no-think level uses its own snappy rule */
  else if(isChain)messages.push({role:"system",content:RULE_PLAY});
  else if(ctx&&ctx.soft)messages.push({role:"system",content:RULE_SOFT});
  else if(lvNow===0)messages.push({role:"system",content:RULE_LV0});
  else messages.push({role:"system",content:RULE_CHAT});
  /* z137: nonsense gate - when he babbles, model must NOT guess what he means */
  if(ctx&&ctx.nonsense)messages.push({role:"system",content:RULE_NONSENSE});
  /* 记忆按场景给：玩梗不翻旧账，只带长期事实 + 记忆开头一小段（够认出他是谁）；
     认真 / 私聊 / 初见 / 接龙 才带全量。省下的一千多字换算成首字速度。 */
  /* z139: skip long facts in no-think mode */
  if(longMem&&lvNow!==0)messages.push({role:"system",content:`【关于小米的长期事实·他认真说过的、记住别忘】\n${longMem}`});
  if(sharedMem){
    /* z106：深度模式的输入费是大头（大模型输入价是快模型的 10 倍）。
       记忆开头就是他这个人是谁 + 长期事实，800 字够认得他；私聊/接龙/初见仍带全量，那几种不能丢上下文。 */
    let memShow;
    if(isPrivate||isChain||!!(ctx&&ctx.intro))memShow=sharedMem;
    if(lvNow===0)memShow=sharedMem.length<=150?sharedMem:(clipMem(sharedMem,150)+"...");
    else if(heartfelt)memShow=sharedMem.length<=800?sharedMem:(clipMem(sharedMem,800)+"…");
    else memShow=sharedMem.length<=400?sharedMem:(clipMem(sharedMem,400)+"…");
    messages.push({role:"system",content:`【三人共用的记忆·用来更懂小米，别像查户口一样主动摊开说】\n${memShow}`});
  }
  /* ===== 以下每轮都在变，统一放最后，护住上面的固定前缀 ===== */
  {
    let emoRule;
    if(heartfelt){
      emoRule="现在他在讲正经事或心里话：基本不用 emoji，最多一个很软的(🥺🫶)。表情包不用你管。";
    }else if((ctx&&ctx.emojiMode)==="none"){
      emoRule="正常说话，别硬加 emoji。表情包不用你管，系统会自动配。";
    }else{
      /* z143: sticker picked on frontend by matching her own reply text */
      emoRule="只管说人话。emoji 真有情绪时才顺手带一个(比如 哈哈哈😂、真的假的🤔)，没想到就不带，别堆一串，别用 ❌✅ 这种机器人符号。表情包不用你管，系统会自动配。";
    }
    /* z143: model only talks - no {{ }} stickers; frontend attaches by reply text */
    messages.push({role:"system",content:"【表情规则·z143】"+emoRule+" 不许在文字里写 {{ }} 这种标记，一个都不许写。"});
  }
  /* z108：之前聊过的（历史被折叠掉的旧话），别装不记得 */
  /* z116：群聊读共享摘要；私聊读自己那条线的 */
  {
    const gistShow=isPrivate?m.gist:sharedGist;
    /* z139: no-think skips gists */
    if(gistShow&&lvNow!==0)messages.push({role:"system",content:"【之前聊过、别装不记得】"+gistShow});
  }
  /* z108：群里别人刚说的话，单独一份（带说话人名字），别跟"小米说的"混在一起。
     私聊和接龙不用：私聊是单独对话，接龙已经有【最后一句】。 */
  /* z139: no-think skips group flow */
  if(lvNow!==0&&!isPrivate&&!isChain&&typeof groupFlow!=="undefined"&&groupFlow.length){
    const others=groupFlow.filter(x=>x.n!==m.name);
    if(others.length)messages.push({role:"system",content:"【群里刚说的话·名字是说话的人·别当成是他说的】"+others.map(x=>x.n+"："+x.t).join(" / ")});
  }
  const recentLines=recentReplies.slice(-6);
  if(recentLines.length)messages.push({role:"system",content:"【别重复】最近说过的别再说："+recentLines.join("；")+"。"});

async function compressImage(file){
  const bmp=await createImageBitmap(file);
  const w=Math.min(bmp.width,800)||800,h=Math.max(1,Math.round(w*(bmp.height/bmp.width)));
  const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(bmp,0,0,w,h);
  if(bmp.close)bmp.close();return c.toDataURL("image/jpeg",0.75);
}
function videoFrames(file){
  return new Promise(resolve=>{
    const v=document.createElement("video");v.muted=true;v.playsInline=true;v.preload="auto";
    const url=URL.createObjectURL(file);v.src=url;
    const bail=()=>{URL.revokeObjectURL(url);resolve([]);};v.onerror=bail;
    v.onloadedmetadata=()=>{
      const dur=Math.max(v.duration||1,0.5);if(!isFinite(dur)){bail();return;}
      const times=[Math.min(0.2,dur),dur*0.45,dur*0.85].filter((t,i,arr)=>t<dur&&arr.indexOf(t)===i).slice(0,3);
      const frames=[];let i=0;
      v.onseeked=()=>{
        try{const ratio=v.videoWidth?(v.videoHeight/v.videoWidth):0.75;const w=Math.min(v.videoWidth||640,640);
          const h=Math.max(1,Math.round(w*ratio));const c=document.createElement("canvas");c.width=w;c.height=h;
          c.getContext("2d").drawImage(v,0,0,w,h);frames.push(c.toDataURL("image/jpeg",0.6));}catch(e){}
        if(++i>=times.length){URL.revokeObjectURL(url);resolve(frames);}else v.currentTime=times[i];
      };
      if(!times.length){bail();return;}v.currentTime=times[0];
    };
    setTimeout(()=>bail(),15000);
  });
}

  talkers.forEach(m=>preconnect(m.url));   /* z114：真发之前再确认一次连接已铺好 */
  if(atts.length){
    /* 发图时全家都能聊：能看图的真看图，看不了图的收到文字提示照常接话 */
    const v=targets.filter(m=>isVision(m.model)&&m.key);

  }

  userMsg(text,atts);
  const status=document.getElementById("statusLine");
  if(privateWith){
    if(!Array.isArray(privateWith.private))privateWith.private=[];
    privateWith.private.push({role:"user",content:text||"(发了图片/视频)",t:Date.now()});

  }else{
    members.forEach(m=>{m.history.push({role:"user",content:text||"(发了图片/视频)",t:Date.now()});trimHist(m);});
  }
  save();

  /* z84：发图时先让看图担当看一眼，生成转述给其他两位 */
  let imgDesc="";
  if(atts.length){
    try{if(status)status.textContent="看一眼图…";}catch(e){}
    imgDesc=await describeImage(atts);

  /* ===== 第一次见面：先把他认识清楚，再进正常聊天 ===== */
  if(!profile.done){
    if(text)profile.facts.push(text.slice(0,120));
    if(profile.step===0&&text){
      const nm=text.replace(/^(我叫|我是|叫|叫我)/,"").replace(/[，。,.!！?？\s].*$/,"").trim();

    groupReset(members.filter(m=>m.key&&m.url&&m.model).map(m=>m.name));   /* z91：本轮三人轮流发言 */
    await Promise.all(members.filter(m=>m.key&&m.url&&m.model).map(async (m,__slot)=>{

      const lazy=aiMsgLazy(m);const sv=makeStreamView(m,lazy,m.name,false);
      try{
        const reply=await callModelNoRepeat(m,text||"你好",atts,{intro:q,emojiMode:pickEmojiMode(),packPick:pickPackCandidates(text||""),imgDesc:imgDesc,lvRef:lvRef,nonsense:nonsense},partial=>sv.push(partial));
        const sh=await sv.finish(reply);
        /* z143: attach sticker by matching her own reply text */
        try{const pk=pickStickerByReply(reply,{lv:thinkLevel,userText:text});if(pk)attachSticker(sh,pk.p);}catch(e){}
        m.history.push({role:"assistant",content:reply,t:Date.now()});
        trimHist(m);
        save();
      }catch(e){
        if(sv){sv._done=true;groupPump();}
        if(e.message==="__cancel"){if(lazy.el&&!(sv&&sv.sent))try{lazy.el.remove();}catch(_){}}
        else if(e.message==="__quiet"){const sh=lazy.ensure();sh.bubble.innerHTML='<span class="quiet">……不想说话</span>';}
        else{
          try{console.warn("[小家] 初见没回上：",e&&e.message);}catch(_){}
          diagPush("初见没回上",e&&e.message);
          const sh=lazy.ensure();sh.bubble.innerHTML='<span class="quiet">……没接上话</span>';
          if(/额度|余额|欠费|重置|HTTP 40[123]/.test(String(e&&e.message||""))){
            try{sysMsg("⚠️ 接口没答应——key 的额度可能用完了，或这把钥匙失效了。详情："+String(e.message).slice(0,120));}catch(_){}
          }
        }
      }
    }));
    if(profile.step>=3){
      /* 认识够了：把他说的整理成档案，从此"认识" */
      const nm=userName();
      const facts=profile.facts.filter(Boolean).map(x=>x.replace(new RegExp("^(我叫|我是)?"+nm+"[，,。\\s]*"),"").trim()).filter(Boolean);
      sharedMem="他叫"+nm+"。\n关于他："+(facts.length?facts.join("；"):"（刚认识，还没聊多少）")+"\n怎么跟他相处（重要）：叫他“"+nm+"”；他更喜欢被提问引导、自己说出答案，别一上来甩一长串方案清单；聊天时保留他原本的说法，别过度替他改写，要像朋友一样；别急着结束对话；不评判他。";
      saveSharedMem();
      profile.done=true;saveProfile();
      sysMsg("🧠 记住了："+nm+"——以后就这么叫你。");
      setTimeout(()=>sysMsg("小提示：点一下你自己的头像，能换成你的照片——只存在你这台设备上，不上传任何地方。"),1200);
    }
    busy=false;
    return;
  }
  /* z89：不再自动切模型。只有你手动打开「深度思考」，才走人味大模型 + 认真提示词；
     平时一律快模型秒回，越短越有梗。isHeartfelt 只留一个用处：这句值不值得记进长期记忆。 */
  /* z138：记录带出处，私聊的事只在私聊里回访 */
  notePendingFollowup(text,privateWith);
  noteCallback(text,privateWith);
  const heardFeeling=isHeartfelt(text);
  /* z137: shared level object for this turn - dragging the slider mid-turn
     updates it, so replies not yet sent follow the new level. */
  /* z138（小米纠正）：档位快照——本轮开跑那一刻的档位，整轮统一。
     中途拉滑块碰不到这一轮；松手写 thinkLevel，下一轮 send() 重新拍快照才生效。 */
  const lvRef={v:thinkLevel};
  /* z137: nonsense detection - when he babbles the model may only ask "?"
     or vibe along, never explain what he meant. */
  const nonsense=isNonsense(text);
  /* z137: level semantics changed, so "serious mode" changed with it.
     Old: level 1 already stopped memes -> felt stuffy.
     New: 0 reply / 1 read-context (still may joke) / 2 advise / 3 do-the-job.
     So meme switch is off only at 2/3. */
  const lvStart=lvRef.v;
  const playMeme=lvStart<=1;
  const heartfelt=lvStart>=2;
  const noMeme=!playMeme;
  // 存记忆 / 存梗：心声里关于自己的写进共享记忆；非心声的闲聊梗词收进共享梗库
  if(heardFeeling&&text){
    /* 他讲的关于自己的事 → 长期事实区（压缩去重、不被冲掉）。跟开不开深度思考无关，都记 */
    addLongFact(text);
    sharedMem=sharedMem.replace(/\n?· 最近[^·\n]*(说了|提到)[^\n]*/g,"").trim();
    sharedMem+="\n· 最近他说："+text.slice(0,80);
    /* z132：底色种子变长了，压缩时锚住种子本体，只压种子后面的聊天记忆，别把底色掐丢 */
    if(sharedMem.length>OWNER_SEED.length+1200){
      if(sharedMem.slice(0,60)===OWNER_SEED.slice(0,60))sharedMem=OWNER_SEED+"\n"+sharedMem.slice(OWNER_SEED.length).slice(-1200);
      else sharedMem=MEM_SEED+"\n"+sharedMem.slice(-1200);
    }
    saveSharedMem();
  }else if(/刷到|新梗|有趣的梗|好玩的梗|加个梗|加梗|收进梗库|进梗库/.test(text)){
    /* 只有小米明说"刷到梗/加个梗"才收进梗库，闲聊不再自动收录 */
    const picked=text.replace(/^.*[:：」"'”’]\s*/,"").trim();
    const meme=(picked&&picked.length<=30&&picked!==text)?picked:text.slice(0,30);
    addMeme(meme);
    sysMsg("📥 已收进梗库："+meme+"（只有你说「刷到/加梗」才收录）");
  }

  const usedMemes=[];
  const lowMood=!noMeme&&isLowMood(text);  /* 状态不高：不整活 */
  /* z137: template cards only when there is something to apply them to.
     "噜啦啦" has no facts, so no template may be used. */
  const bareText=String(text||"").replace(/[\s。！？!?~～….,，]/g,"");
  /* z145：小米要风格牌用得更多——去掉"短句/发癫不许用模板牌"的限制，
     模板牌照常抽（权重已从1提到3），由模型按语境自己决定套不套。 */
  const canTemplate=true;
  let draws=talkers.map(m=>{
    let rp=privateWith?null:drawRP(lowMood?"soft":null);
    let myMemes=[];
    if(!noMeme&&!lowMood&&text&&!nonsense&&Math.random()<0.45){
      myMemes=pickMemeCandidates(text,usedMemes,3);
      myMemes.forEach(x=>{if(usedMemes.indexOf(x)<0)usedMemes.push(x);});
    }
    return {m,rp,myMemes};
  });
  /* ============================================================
     z111：群聊拆成两条物理隔离的通道，谁也不许抢谁的节奏
     ── 通道 B 接龙（有队形）：优先级最高。起头 → 台词按序 → 自由人，一句播完才轮到下一句
     ── 通道 A 正常说话：没人带队形，三人同一瞬间想，谁先想好谁先说
     以前两套混在一个 Promise.all 里跑：本地写死的台词比模型快得多，抢在起头前面出声，
     队形就散了（「你只是怕了」出来了，起头那句还没影）。现在按 formation 分岔，各走各的。
     ============================================================ */
  const owedCard=[];      /* 被顶掉牌的人，接龙时优先补自己的牌 */
  const pendingChain=[];  /* 人不够时没排上的接话，留到接龙补完（两人也能跑完整三连） */
  /* z134：接龙流派并进梗库（CHAIN_MEMES）——小米的话命中连环梗触发词才起接龙，不再随机抽牌 */
  const chainHit=(!noMeme&&!privateWith&&!nonsense)?matchChainMeme(text):null;
  /* z135：他们也能起接龙——偶尔（8%）把小米说的事套进流派梗起头，平常话不碰 */
  let aiLead=null,aiLeadDraw=null;
  {
    const _bare=String(text||"").replace(/[\s。！？!?~～….,，]/g,"");
    if(!chainHit&&!noMeme&&!lowMood&&!privateWith&&!nonsense&&draws.length>=2&&_bare.length>2&&Math.random()<0.08){
      aiLead=CHAIN_MEMES.find(c=>c.name==="恐惧派")||CHAIN_MEMES[0];
      aiLeadDraw=draws[Math.floor(Math.random()*draws.length)];
    }
  }
  /* 这一行决定走哪条通道：命中连环梗或AI起头=接龙，没命中=正常说话 */
  const formation=!!(chainHit||aiLead);

  /* z126·抄群相「看脸色+闭嘴」：真人不会每次全员到齐。
     只在正常说话通道生效；接龙有固定队形，动了梗就散，不碰。
     规则：低落→只留一人先共情(Vesta优先)；两个字/纯语气词→只留一人；其余维持三人。 */
  const bare=String(text||"").replace(/[\s。！？!?~～….,，]/g,"");
  const tinyMsg=bare.length<=2||/^(嗯|哦|啊|额|呃|哈|嗨|哟|好|行|OK|ok|笑死|哈哈+|呜|唉)[啊呀哦呢嘛哈]*$/i.test(bare);
  let quietTurn=false;
  if(!noMeme&&!privateWith&&!formation&&talkers.length>1){
    if(lowMood){
      quietTurn=true;
      const comforter=draws.find(d=>d.m&&d.m.name==="Vesta")||draws[0];
      draws=draws.filter(d=>d===comforter);
    }else if(tinyMsg){
      quietTurn=true;
      draws=[draws[Math.floor(Math.random()*draws.length)]];
    }
  }

  /* 屏幕上真正播出去的句子。接龙只认这个——没播出来的，绝不许拿去接 */
  function playedWords(){
    return (groupPlayer.played||[]).map(x=>x.n+"："+x.t);
  }
  /* 接龙通道专用：说一句，等它完整播完才返回（下一个人才开口，绝不抢跑） */
  async function chainSay(d,free){
    const m=d.m,rp=d.rp,myMemes=d.myMemes||[];
    const lazy=aiMsgLazy(m);const sv=makeStreamView(m,lazy,m.name,rp&&/应声虫|复读/.test(rp.name||""));
    try{
      const saidNow=playedWords();
      const ctx={memes:free?myMemes:[],rp:rp,
        emojiMode:pickEmojiMode(),packPick:pickPackCandidates(text||""),imgDesc:imgDesc,
        lvRef:lvRef,nonsense:nonsense};
      if(free){   /* 自由接话：贴着屏幕上最后一句，别重复这轮说过的 */
        ctx.chain=true;
        ctx.lastLine=saidNow.length?saidNow[saidNow.length-1]:"";
        ctx.said=saidNow.slice(-6);
      }
      const reply=(rp&&rp.fixed)?rp.fixed:await callModelNoRepeat(m,free?"(接着群里的话，自然接一句)":text,atts,ctx,partial=>sv.push(partial));
      const sh=await sv.finish(reply);
      /* z143: sticker by reply text */
      try{const pk=pickStickerByReply(reply,Object.assign({},ctx,{userText:text}));if(pk)attachSticker(sh,pk.p);}catch(e){}
      if(sh){sh.el.classList.add("spoke");setTimeout(()=>sh.el.classList.remove("spoke"),750);}
      if(privateWith){
        /* z136：私聊回复只进私聊记录，不进群历史 */
        privateWith.private.push({role:"assistant",content:reply,t:Date.now()});
        if(privateWith.private.length>40)privateWith.private.splice(0,privateWith.private.length-40);
      }else{
        m.history.push({role:"assistant",content:reply,t:Date.now()});trimHist(m);
        logFlow(m.name,reply);   /* 互相看见：记一份群流水 */
      }
      save();
      return reply;
    }catch(e){
      if(sv){sv._done=true;groupPump();}
      if(e.message==="__cancel"){if(lazy.el&&!(sv&&sv.sent))try{lazy.el.remove();}catch(_){}}
      else if(e.message==="__quiet"){const sh=lazy.ensure();sh.bubble.innerHTML='<span class="quiet">……不想说话</span>';}
      else{
        try{console.warn("[小家] 这轮没回上：",e&&e.message);}catch(_){}
        diagPush("这轮没回上",e&&e.message);
        const sh=lazy.ensure();sh.bubble.innerHTML='<span class="quiet">……没接上话</span>';
        if(/额度|余额|欠费|重置|HTTP 40[123]/.test(String(e&&e.message||""))){
          try{sysMsg("⚠️ 接口没答应——key 的额度可能用完了，或这把钥匙失效了。详情："+String(e.message).slice(0,120));}catch(_){}
        }
      }
      return null;
    }
  }

  if(formation){
    /* ================= 通道 B：接龙（严格串行）——z134 起，只由连环梗触发 ================= */
    let leadD=null;
    if(chainHit){
      /* 小米的话命中连环梗：他那句就是第一句，AI 直接按台词往下接 */
      /* z130：接龙放松——收尾台词30%概率没人接，像真群聊，起头的照起、后头的随缘 */
      const _all=chainHit.lines;
      const _n=(_all.length>1&&Math.random()<0.3)?_all.length-1:_all.length;
      const seat=draws.slice();
      _all.slice(0,_n).forEach((t,i)=>{
        const txt=Array.isArray(t)?t[Math.floor(Math.random()*t.length)]:t;
        const o=seat[i];
        if(o){const owedRp=o.rp;o.rp={name:txt,fixed:txt,order:i};owedCard.push({m:o.m,rp:owedRp});}
        else pendingChain.push(txt);
      });
      seat.slice(_n).forEach(o=>{o.rp=drawRP("chain");});
    }else if(aiLead&&aiLeadDraw){
      /* z135：AI 起接龙——把小米说的事套进流派梗起头，其他人接，收尾随缘（30%概率没人接） */
      aiLeadDraw.rp={name:"恐惧派",desc:"你起头：把小米刚才说的那件事套进『根本就没有这样的X』起头（X换成他提到的那个东西），只说这一句起头的话。"};
      const others=draws.filter(d=>d!==aiLeadDraw);
      const _all=aiLead.lines;
      const _n=(_all.length>1&&Math.random()<0.3)?_all.length-1:_all.length;
      _all.slice(0,_n).forEach((t,i)=>{
        const txt=Array.isArray(t)?t[Math.floor(Math.random()*t.length)]:t;
        const o=others[i];
        if(o){const owedRp=o.rp;o.rp={name:txt,fixed:txt,order:i};owedCard.push({m:o.m,rp:owedRp});}
        else pendingChain.push(txt);
      });
      others.slice(_n).forEach(o=>{o.rp=drawRP("chain");});
      leadD=aiLeadDraw;   /* 起头的人第一个说话 */
    }
    groupReset(draws.map(d=>d.m.name));
    /* 座次只有一种：起头 → 台词按 order → 剩下的人 */
    const seatOrder=[];
    if(leadD)seatOrder.push({d:leadD,free:false});
    draws.filter(d=>d!==leadD&&d.rp&&d.rp.fixed)
      .sort((a,b)=>(a.rp.order||0)-(b.rp.order||0))

    for(let i=0;i<seatOrder.length;i++){
      if(myRun!==runSeq){status.textContent="";return;}   /* 被打断：这一轮立刻停 */
      await chainSay(seatOrder[i].d,seatOrder[i].free);
    }
  }else{
    /* ================= 通道 A：正常说话（同时想，谁快谁说，原样不动） ================= */
    groupReset(draws.map(d=>d.m.name));   /* z91：本轮轮流发言 */
    await Promise.all(draws.map(async ({m,rp,myMemes},__slot)=>{
      /* 三人同一时刻开始想，但请求之间留 120ms 微错峰，别撞服务端并发限制 */
      if(__slot>0)await new Promise(r=>setTimeout(r,__slot*120));
      const lazy=aiMsgLazy(m);const sv=makeStreamView(m,lazy,m.name,rp&&/应声虫|复读/.test(rp.name||""));
      try{
        const reply=(rp&&rp.fixed)?rp.fixed:await callModelNoRepeat(m,text,atts,{heartfelt:heartfelt,noMeme:noMeme,memes:myMemes||[],rp:rp,private:!!privateWith,soft:lowMood,emojiMode:pickEmojiMode(),packPick:pickPackCandidates(text||""),imgDesc:imgDesc,lvRef:lvRef,nonsense:nonsense},partial=>sv.push(partial));
        const sh=await sv.finish(reply);
        /* z143: sticker by reply text, skip no-think */
        try{const pk=pickStickerByReply(reply,{lvRef:lvRef,heartfelt:heartfelt,userText:text});if(pk)attachSticker(sh,pk.p);}catch(e){}
        if(sh){sh.el.classList.add("spoke");setTimeout(()=>sh.el.classList.remove("spoke"),750);}
        /* z140: channel A - private replies must NOT go to group history.
           Previously m.history.push ran unconditionally; in private chat m IS privateWith,
           so the reply landed in group history and restoreHistory drew it back in the group. */
        if(privateWith){
          privateWith.private.push({role:"assistant",content:reply});
          if(privateWith.private.length>40)privateWith.private.splice(0,privateWith.private.length-40);
        }else{
          m.history.push({role:"assistant",content:reply});trimHist(m);
          logFlow(m.name,reply);   /* 互相看见：只记群流水，不往别人历史里塞"用户：某某: 话" */
        }
        save();
      }catch(e){
        if(sv){sv._done=true;groupPump();}
        if(e.message==="__cancel"){if(lazy.el&&!(sv&&sv.sent))try{lazy.el.remove();}catch(_){}}
        else if(e.message==="__quiet"){const sh=lazy.ensure();sh.bubble.innerHTML='<span class="quiet">……不想说话</span>';}
        else{
          try{console.warn("[小家] 这轮没回上：",e&&e.message);}catch(_){}
          diagPush("这轮没回上",e&&e.message);
          const sh=lazy.ensure();sh.bubble.innerHTML='<span class="quiet">……没接上话</span>';
          if(/额度|余额|欠费|重置|HTTP 40[123]/.test(String(e&&e.message||""))){
            try{sysMsg("⚠️ 接口没答应——key 的额度可能用完了，或这把钥匙失效了。详情："+String(e.message).slice(0,120));}catch(_){}
          }
        }
      }
    }));
  }
  if(myRun!==runSeq){status.textContent="";return;} /* 这一轮被打断了，不再接龙 */

  /* ===== 收尾补接龙：欠的台词、欠的牌必须出；没欠的就 30% 概率随便加一两句 ===== */
  /* z145：不思考档=秒回，三人说完就结束——关掉"没欠台词却随机补一两句"，
     那要多调一次模型，是"回得慢"的真凶。真欠台词的接龙仍照常补。 */
  const isNoThink=(lvRef.v===0);
  let followUps=(!isNoThink&&!noMeme&&!quietTurn&&talkers.length>1&&Math.random()<0.3)?1+Math.floor(Math.random()*2):0;
  const needMore=pendingChain.length+owedCard.length;
  if(!noMeme&&!quietTurn&&needMore+1>followUps)followUps=needMore+1;
  let prev=null;
  for(let i=0;i<followUps;i++){
    if(myRun!==runSeq)break;   /* 被新消息打断就别再往下接龙 */
    let cand=talkers.filter(x=>x!==prev);
    if(!cand.length)break; /* 单独聊天时没人接龙，直接结束 */
    let sp,cRp;
    if(pendingChain.length){ /* 人不够，没排上的接话在这补完 */
      const pick=cand.length?cand:talkers;
      sp=pick[Math.floor(Math.random()*pick.length)];
      const txt=pendingChain.shift();cRp={name:txt,fixed:txt};
    }else if(owedCard.length){const owed=owedCard.shift();sp=owed.m;cRp=owed.rp||drawRP("chain");} /* 补上被顶掉的原牌 */
    else{sp=cand[Math.floor(Math.random()*cand.length)];cRp=drawRP("chain");}

    const saidNow=playedWords();
    const lastLine=saidNow.length?saidNow[saidNow.length-1]:"";
    let cMemes=[];
    if(!noMeme&&Math.random()<0.6&&cRp){
      cMemes=pickMemeCandidates(lastLine||"",usedMemes,6);
      cMemes.forEach(x=>{if(usedMemes.indexOf(x)<0)usedMemes.push(x);});
    }
    const ok=await chainSay({m:sp,rp:cRp,myMemes:cMemes},!!(cRp&&!cRp.fixed));
    if(ok===null)break;
    prev=sp;
    await new Promise(r=>setTimeout(r,60+Math.random()*80));   /* 句间留一点呼吸，但不再死等一秒多 */
  }

  status.textContent="";
  // 共享记忆超长时整理一次（三人一起）
  const totalLines=members.reduce((a,m)=>a+histChars(m),0);
  if(totalLines>memLimit){
    status.textContent="🧠 正在整理共享记忆…";
    try{
      const ok=await distillMemory();
      if(ok)sysMsg(`🧠 把聊过的整理进了共享记忆，开启新对话。`,'memory');
    }catch(e){sysMsg(`🧠 这次没整理成功（${esc(e.message)}），下次再试。`);}
  }
  status.textContent="";busy=(myRun!==runSeq);
}

/* ===== 格子号（预留，当前没有网络实现） =====
   早期计划是"数据存一份到网上，清缓存/换设备也能取回"，但这个版本只实现了格子号的生成与记忆，
   全文件没有任何上传/拉取请求——数据实际只存在本机。
   换设备请用导出/导入备份；真要云同步，得先接一个存储后端再说。
   钥匙永远不上传，这一点没变。 */
const LS_SYNC_ID="ai_sync_id_v1";
// 格子号固定不变：以后真接上云时，不管网址怎么换、缓存怎么清，数据都对得上同一格
const CLOUD_SYNC_KEY="XIAOJIA-DEMO";
function syncId(){
  /* ?u=xxxx：借用别人的格子（临时，不写死在本机）；?reset=1：清掉本机记的格子，回到自己的 */
  let q=null;try{q=new URLSearchParams(location.search);}catch(e){}
  let saved="";try{saved=localStorage.getItem(LS_SYNC_ID)||"";}catch(e){}
  if(q&&q.get("reset")==="1"){
    try{localStorage.removeItem(LS_SYNC_ID);}catch(e){}
    saved="";
    /* 只清这一次：把 reset 从地址栏抹掉，免得每次打开都把格子重置一遍 */
    try{const us=new URLSearchParams(location.search);us.delete("reset");
      history.replaceState(null,"",location.pathname+"?"+us.toString()+(location.hash||""));}catch(e){}
  }
  const u=q?(q.get("u")||""):"";
  /* 带 u= 的链接：这一次就用那个格子，但绝不记进本机——否则本机被别人的格子绑死，钥匙就跟着跑到别的格子里去了 */
  if(u&&/^[A-Za-z0-9_-]{2,40}$/.test(u))return u;
  /* 历史遗留：本机曾被某个 u 格绑住（就是钥匙老是丢的根子），回到自己的主格 */
  if(saved&&saved!==CLOUD_SYNC_KEY){
    try{localStorage.setItem("ai_sync_id_old",saved);}catch(e){}   // 留个底，等下从旧格把钥匙捞回来
    try{localStorage.setItem(LS_SYNC_ID,CLOUD_SYNC_KEY);}catch(e){}
    return CLOUD_SYNC_KEY;
  }
  if(saved)return saved;
  try{localStorage.setItem(LS_SYNC_ID,CLOUD_SYNC_KEY);}catch(e){}
  return CLOUD_SYNC_KEY;
}

/* z140: one-time cleanup - remove private replies that leaked into group history.
   A reply present in both m.private (assistant) and m.history is a leak:
   delete from group history only. Private threads and seed memory stay untouched.
   Runs once (localStorage flag); source fix prevents new leaks. */
function cleanLeakedPrivateOnce(){
  const FLAG="ai_private_leak_cleaned_z140";
  try{
    if(localStorage.getItem(FLAG)==="1")return 0;
    let n=0;
    members.forEach(m=>{
      const priv=Array.isArray(m.private)?m.private:[];
      const texts=priv.filter(h=>h&&h.role==="assistant"&&h.content).map(h=>String(h.content));
      if(!texts.length)return;
      const before=(m.history||[]).length;
      m.history=(m.history||[]).filter(h=>!(h&&h.role==="assistant"&&texts.indexOf(String(h.content))>=0));
      n+=before-(m.history||[]).length;
    });
    if(n){save();try{sysMsg("🧹 removed "+n+" leaked private replies from group history; memory untouched.");}catch(e){}}
    localStorage.setItem(FLAG,"1");
    return n;
  }catch(e){return 0;}
}

function initThinkSheet(){
  applyThinkLevel(thinkLevel);
  const sheet=document.getElementById("thinkSheet");if(!sheet)return;
  const row=document.getElementById("tsRow"),knob=document.getElementById("tsKnob"),fill=document.getElementById("tsFill"),sparks=document.getElementById("tsSparks");
  let dragging=false,lastLv=thinkLevel;
  /* 连续值：拇指完全跟手（0~1 浮点），松手才吸附到最近档 —— 照抄参考 */
  const ratioFromX=x=>{
    if(!row)return 0;
    const r=row.getBoundingClientRect();
    if(r.width<=0)return 0;
    return Math.max(0,Math.min(1,(x-r.left)/r.width));
  };
  const lvFromRatio=t=>Math.round(t*3);
  const paintContinuous=t=>{
    const col=TS_COLORS[lvFromRatio(t)]||TS_COLORS[0];
    if(fill){fill.style.width=(t*100)+"%";fill.style.background=col.grad;}
    if(knob)knob.style.left=(t*100)+"%";
    if(sparks)sparks.style.width=(t*100)+"%";
    tsPaintVars(lvFromRatio(t),col);
    tsPaintSparks(lvFromRatio(t),col);
  };
  const start=e=>{
    dragging=true;if(row){row.classList.add("dragging");row.style.setProperty("--iq-scale","1.12");}
    try{e.preventDefault();}catch(_){}
    if(row&&row.setPointerCapture&&e.pointerId!=null)try{row.setPointerCapture(e.pointerId);}catch(_){}
    paintContinuous(ratioFromX(e.clientX||0));
  };
  const move=e=>{if(!dragging)return;e.preventDefault();paintContinuous(ratioFromX(e.clientX||0));};
  const end=()=>{
    if(!dragging)return;dragging=false;
    if(row){row.classList.remove("dragging");row.style.setProperty("--iq-scale","1");}
    const finalLv=lvFromRatio(lastRatio);
    const changed=finalLv!==thinkLevel;
    applyThinkLevel(finalLv);lastLv=finalLv;
    /* z138 (corrected): switching does NOT interrupt the running turn.
       The turn finishes on the level it started with; the slider only
       writes thinkLevel, which the NEXT turn picks up. */
    sysMsg("思考深度：「"+THINK_INFO[finalLv].name+"」"+(finalLv===3?"（会打开模型自己的思考，慢一些）":"")
      +(changed?"　· 下一轮对话生效":""));
  };
  let lastRatio=TS_POS[thinkLevel]/100;
  const start2=e=>{lastRatio=ratioFromX(e.clientX||0);start(e);};
  const move2=e=>{if(!dragging)return;lastRatio=ratioFromX(e.clientX||0);e.preventDefault();paintContinuous(lastRatio);};
  if(row){
    row.addEventListener("pointerdown",start2);
    row.addEventListener("pointermove",move2);
    row.addEventListener("pointerup",end);
    row.addEventListener("pointercancel",end);
  }
  document.addEventListener("click",e=>{if(!sheet.contains(e.target)&&e.target.id!=="btnIQ")sheet.classList.remove("show");});
  const iq=document.getElementById("btnIQ");
  if(iq)iq.onclick=e=>{
    e.stopPropagation();
    const emo=document.getElementById("emojiPanel"),panel=document.getElementById("plusPanel");
    sheet.classList.toggle("show");
    if(sheet.classList.contains("show")){if(emo)emo.classList.remove("show");if(panel)panel.classList.remove("show");}
  };
}
(function initWxShell(){
  const back=document.getElementById("btnBack");if(back)back.onclick=wxBack;
  const clear=document.getElementById("btnBroom");if(clear)clear.onclick=wxClearChat;
  const btn=document.getElementById("btnAttach"),panel=document.getElementById("plusPanel"),emo=document.getElementById("emojiPanel");
  if(btn&&panel){
    btn.onclick=e=>{e.stopPropagation();panel.classList.toggle("show");if(emo)emo.classList.remove("show");};
    document.addEventListener("click",e=>{if(!panel.contains(e.target)&&e.target!==btn)panel.classList.remove("show");});
  }
  const cam=document.getElementById("camInput"),file=document.getElementById("fileInput");
  const pc=document.getElementById("ppCamera"),pf=document.getElementById("ppPhoto");
  if(pc&&cam)pc.onclick=()=>cam.click();
  if(pf&&file)pf.onclick=()=>{file.click();};
  initThinkSheet();
  if(cam)cam.onchange=async()=>{
    for(const f of cam.files){
      try{if(f.type.startsWith("image/"))attachments.push({type:"image",dataUrl:await compressImage(f),name:f.name});}
      catch(e){sysMsg("这张照片处理失败："+e.message);}
    }
    cam.value="";renderAttachRow();if(panel)panel.classList.remove("show");
  };
})();
(async function start(){
  load();
  if(!KEY){
    loadKey();
    if(!KEY){const ik=await idbGet("key");if(ik&&ik.indexOf("sk-")===0)saveKey(ik);}   // 再一层：IndexedDB
    /* 开源版：每台设备只认本机填过的钥匙，不从站点或网址取，谁也蹭不到作者额度 */
    if(KEY)writeKeyEverywhere(KEY);
  }
  /* 每台设备只用这台设备自己填的钥匙：不留在任何一格是别人的（避免代码某个角落把别人的额度带上来） */
  if(KEY)members.forEach(m=>{m.key=KEY;});
  if(KEY){writeKeyEverywhere(KEY);}   // 老用户升级/从存储捞回：补写本机各层（不写地址）
  const migChanged=migrateMemes()||migrateModels();
  migrateNewMemes();
  migrateOldNames();
  if(migChanged)save();
  const nCleaned=sanitizeHistory();
  if(nCleaned)save();
  renderSpend();
  preconnectMembers();   /* z114：成员表读完后，按每个人实际的接口地址再补一次 */
  refreshGroupAvatar();
  try{document.querySelectorAll('img[data-sc]').forEach(im=>{im.src=scSuffix(im.getAttribute('src'));});}catch(e){}
  try{
    let lk="读不到";try{lk=localStorage.getItem("ai_key_v1")?"有":"无";}catch(e){lk="读不到";}
    let ck="无";try{ck=readKeyCookie()?"有":"无";}catch(e){}
    const sa=(window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches)||window.navigator.standalone===true;
    const dg=document.getElementById("keyDiag");
    if(dg)dg.innerHTML="版本 <b style='color:#fff'>"+APP_VER+"</b>　·　打开方式："+(sa?"<b style='color:#ffd166'>桌面图标</b>":"浏览器")+
      "<br>钥匙只在本机：<b style='color:"+(lk==="有"?"#7ee787":"#ff7b72")+"'>"+lk+"</b>　·　cookie：<b style='color:"+(ck==="有"?"#7ee787":"#ff7b72")+"'>"+ck+"</b>　·　本机备份：<b style='color:"+(lk==="有"?"#7ee787":"#ff7b72")+"'>"+(lk==="有"?"已存":"未存")+"</b>";
  }catch(e){}
  renderConvList();   /* z117：会话列表先画好，退出再进能看到四个会话 */
  if(!KEY){document.getElementById("keyOverlay").classList.add("show");}
  else if(!profile.done){sysMsg("随便说句话，她们先问你叫什么。");}
  else{
    /* z140: clean leaked private replies before drawing group history */
    try{cleanLeakedPrivateOnce();}catch(e){}
    /* z117：把存下来的对话画回屏幕——以前只写欢迎语，所以看着像"记录全丢了" */
    try{restoreHistory();}catch(e){}
    if(!(chatBox&&chatBox.children.length))sysMsg("它们记得你。说句话试试～");
    try{setTimeout(()=>{if(!maybeProactiveGreet())setTimeout(maybeOldThing,1600);},900);}catch(e){}   /* z129：待跟进优先，没轮到它才旧事重提 */
  }
})();
