<!DOCTYPE html>
<!-- 三人行 · 多模型并发的 AI 群聊，纯前端单文件实现 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="三人行">
<meta name="theme-color" content="#16151c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<!-- 真 PWA：manifest 的 href 由脚本动态补 sharecode（本网关不带码会 403） -->
<link rel="apple-touch-icon" href="home.jpg">
<link rel="apple-touch-icon" sizes="192x192" href="home.jpg">
<link rel="icon" type="image/jpeg" href="home.jpg">
<link rel="manifest" id="manifestLink" href="manifest.webmanifest">
<!-- z114：首字提速——提前跟模型接口握手。移动网络冷启动 TLS 握手要 100~300ms，等 fetch 那刻才开始就白等了。
     crossorigin 必须带，否则建的连接跟 CORS 请求对不上、复用不了。 -->
<link rel="preconnect" href="https://api.siliconflow.cn" crossorigin>
<link rel="dns-prefetch" href="https://api.siliconflow.cn">
<title>三人行</title>
<style>

/* ===== 统一色板：低饱和莫兰迪 · 暖灰紫（精修） ===== */
:root{
  --bg0:#16151c; --bg1:#211f29; --bg2:#1b1922; --panel:#26232f; --panelA:rgba(38,35,47,.88);
  --line:#3a3646; --lineSoft:#302d3b; --lineFaint:#292631;
  --text:#f0ecf3; --text2:#cbc5d4; --muted:#948da1; --muted2:#726c7f;
  --accent:#d0a981; --accent2:#a6b9aa;
  --accentRgb:208,169,129; --accent2Rgb:166,185,170;
  --c-gpt:#cbb0da; --c-claude:#d9ad8b; --c-deep:#a6bfcd;
  --me1:#6d5e78; --me2:#52465e;
  --glow1:#6b6f9c; --glow2:#8c7596; --glow3:#a38590; --glow4:#6f938b;
  --sh1:0 2px 10px rgba(0,0,0,.2);
  --sh2:0 10px 30px rgba(0,0,0,.3);
  --sh3:0 28px 70px rgba(0,0,0,.5);
  --hairline:inset 0 1px 0 rgba(255,255,255,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:"PingFang SC","Microsoft YaHei","Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",system-ui,sans-serif;
  color:var(--text);overflow:hidden;position:relative;background:var(--bg0);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
/* ===== 流光背景：低饱和光晕 + 一层柔光罩 ===== */
#aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:var(--bg0)}
#aurora::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% -10%,rgba(var(--accentRgb),.09),transparent 55%),radial-gradient(ellipse at 50% 110%,rgba(var(--accent2Rgb),.06),transparent 55%)}
#aurora .blob{position:absolute;border-radius:50%;filter:blur(120px);opacity:.3;will-change:transform}
#aurora .b1{width:60vw;height:60vw;left:-15vw;top:-20vw;background:radial-gradient(circle,var(--glow1),transparent 70%);animation:float1 22s ease-in-out infinite}
#aurora .b2{width:55vw;height:55vw;right:-15vw;top:-10vw;background:radial-gradient(circle,var(--glow2),transparent 70%);animation:float2 28s ease-in-out infinite}
#aurora .b3{width:50vw;height:50vw;left:15vw;bottom:-25vw;background:radial-gradient(circle,var(--glow3),transparent 70%);animation:float3 25s ease-in-out infinite}
#aurora .b4{width:45vw;height:45vw;right:5vw;bottom:-20vw;background:radial-gradient(circle,var(--glow4),transparent 70%);animation:float4 30s ease-in-out infinite}
@keyframes float1{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(18vw,14vh) scale(1.25)}66%{transform:translate(8vw,28vh) scale(.9)}}
@keyframes float2{0%,100%{transform:translate(0,0) scale(1)}40%{transform:translate(-20vw,20vh) scale(1.2)}70%{transform:translate(-8vw,6vh) scale(.85)}}
@keyframes float3{0%,100%{transform:translate(0,0) scale(1)}35%{transform:translate(12vw,-18vh) scale(1.3)}70%{transform:translate(-6vw,-8vh) scale(.9)}}
@keyframes float4{0%,100%{transform:translate(0,0) scale(1)}45%{transform:translate(-16vw,-14vh) scale(1.15)}75%{transform:translate(-4vw,-24vh) scale(.9)}}
@media(prefers-reduced-motion:reduce){#aurora .blob{animation:none}}
#stars{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:-1}
.star{position:absolute;background:#fff;border-radius:50%;opacity:.5;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.7}}

/* ===== 主容器 ===== */
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;max-width:900px;margin:0 auto;box-shadow:var(--sh3)}

/* ===== 顶栏 ===== */
#topbar{height:68px;flex:0 0 68px;display:flex;align-items:center;gap:12px;padding:0 20px;
  background:var(--panelA);backdrop-filter:blur(24px);border-bottom:1px solid var(--lineFaint);box-shadow:var(--hairline)}
.groupAvatar{width:44px;height:44px;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,#8c7596,#6f938b);
  display:flex;align-items:center;justify-content:center;font-size:22px;flex:0 0 44px;border:1px solid rgba(255,255,255,.14);box-shadow:var(--sh1),var(--hairline)}
.groupAvatar img{width:100%;height:100%;object-fit:cover}
.groupAvatar{cursor:pointer}
.groupAvatar:hover{filter:brightness(1.15)}
.quiet{color:var(--muted);opacity:.8}
.titles{flex:1;min-width:0}
.gname{font-size:16px;font-weight:700;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.gsub{font-size:11px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px;letter-spacing:.3px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent2);box-shadow:0 0 9px rgba(var(--accent2Rgb),.8);display:inline-block}
.ibtn{width:38px;height:46px;border-radius:14px;border:1px solid var(--lineSoft);background:rgba(255,255,255,.045);color:var(--text2);
  font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 38px;transition:.18s;box-shadow:var(--hairline)}
.ibtn:hover{background:rgba(var(--accentRgb),.16);border-color:var(--accent);color:var(--text);transform:translateY(-1px)}

/* ===== 消息区 ===== */
#chatBox{flex:1;overflow-y:auto;padding:26px 20px 14px;scroll-behavior:smooth}
#chatBox::-webkit-scrollbar{width:6px}
#chatBox::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:6px}
.msg{display:flex;gap:12px;margin-bottom:24px;animation:msgIn .25s ease both}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg .mavatar{width:48px;height:48px;flex:0 0 48px;border-radius:0;overflow:visible;display:flex;align-items:center;justify-content:center;
  font-size:20px;background:none;border:none}
.msg .mavatar img{width:100%;height:100%;object-fit:cover;border-radius:14px;box-shadow:0 5px 12px rgba(0,0,0,.45);filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.msg.me .mavatar img{border-radius:14px;filter:brightness(1.06);box-shadow:0 3px 9px rgba(0,0,0,.45)}
.msg.me .mavatar{cursor:pointer}
.msg.me .mavatar:hover{filter:brightness(1.35)}
.msg.me .mavatar:hover::after{content:"换";position:absolute;font-size:12px;color:#fff;text-shadow:0 1px 3px #000;pointer-events:none}
.msg .body{max-width:75%;min-width:0}
.msg .meta{font-size:11px;color:var(--muted);margin:0 0 6px 3px;display:flex;align-items:center;gap:6px;letter-spacing:.4px}
.msg .badge{font-size:10px;padding:2px 7px;border-radius:7px;background:rgba(255,255,255,.06);border:1px solid var(--lineSoft);color:var(--muted)}
.msg .bubble{display:inline-block;padding:11px 15px;border-radius:6px 18px 18px 18px;
  background:linear-gradient(150deg,#332f3e,#2b2835);border:1px solid var(--line);
  font-size:14px;line-height:1.7;color:var(--text);word-break:break-word;white-space:pre-wrap;box-shadow:var(--sh1),var(--hairline)}
.msg.who-gpt .meta{color:var(--c-gpt)}
.msg.who-claude .meta{color:var(--c-claude)}
.msg.who-deepseek .meta{color:var(--c-deep)}
.msg.me{flex-direction:row-reverse}
.msg.me .body{display:flex;flex-direction:column;align-items:flex-end}
.msg.me .meta{margin:0 3px 6px 0}
.msg.me .bubble{background:linear-gradient(150deg,var(--me1),var(--me2));border-color:rgba(255,255,255,.12);
  color:#f7f3f8;border-radius:18px 6px 18px 18px;box-shadow:var(--sh1),var(--hairline)}
.msg.system{justify-content:center}
.msg.system .bubble{background:rgba(255,255,255,.035);border:1px solid var(--lineFaint);color:var(--muted2);font-size:11px;letter-spacing:.3px;
  padding:6px 15px;border-radius:20px;text-align:center;white-space:normal;box-shadow:none}
.msg.memory .bubble{background:rgba(var(--accentRgb),.1);border:1px solid rgba(var(--accentRgb),.32);color:var(--accent);font-size:11px;border-radius:20px;text-align:center}
.typingDot{color:var(--muted);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.msg .bubble img{display:block;max-width:100%;border-radius:10px;margin-top:8px}
.msg .bubble video.stickerVid{display:block;max-width:100%;max-height:280px;border-radius:12px;margin-top:8px;background:rgba(0,0,0,.4)}
.msg .bubble img.stickerImg{display:block;max-width:120px;max-height:120px;border-radius:12px;margin-top:6px;object-fit:contain}
.err{color:#dd9292;font-size:12.5px}

/* 头像状态（z82：去掉思考时头像闪烁） */
.msg.spoke .mavatar img{animation:avHop .6s ease}
@keyframes avHop{0%{transform:scale(1)}30%{transform:translateY(-4px) scale(1.14)}65%{transform:translateY(-1px) scale(1.06)}100%{transform:scale(1)}}
.msg.sadav .mavatar img{opacity:.45}
.mavatar{overflow:visible}

/* ===== 输入区 ===== */
#composer{flex:0 0 auto;padding:14px 20px 18px;background:var(--panelA);backdrop-filter:blur(24px);border-top:1px solid var(--lineFaint);box-shadow:var(--hairline)}
#atBar{display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
#atBar .lbl{font-size:11px;color:var(--muted)}
#chips{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.chip{display:flex;align-items:center;gap:5px;padding:4px 11px 4px 4px;border-radius:20px;border:1px solid var(--lineSoft);
  background:rgba(255,255,255,.045);font-size:11.5px;cursor:pointer;transition:.18s;color:var(--text2)}
.chip:hover{border-color:var(--accent);color:var(--text)}
.chip .cdot{width:22px;height:22px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--line);font-size:12px}
.chip .cdot img{width:100%;height:100%;object-fit:cover}
.chip.on{background:rgba(var(--accent2Rgb),.16);border-color:var(--accent2);color:#d2e2d7}
#attachRow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
#attachRow:empty{display:none}
.thumb{position:relative;width:54px;height:54px;border-radius:12px;overflow:hidden;background:rgba(0,0,0,.4);border:1px solid var(--lineSoft);box-shadow:var(--sh1)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .rm{position:absolute;top:0;right:0;width:18px;height:18px;background:rgba(0,0,0,.75);color:#fff;font-size:11px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:0 0 0 10px}
#inputRow{display:flex;gap:10px;align-items:flex-end}
#inputBox{flex:1;min-height:46px;max-height:120px;resize:none;border-radius:15px;border:1px solid var(--line);
  background:var(--bg2);color:var(--text);padding:13px 15px;font-size:14px;font-family:inherit;outline:none;line-height:1.5;
  transition:.18s;box-shadow:inset 0 1px 3px rgba(0,0,0,.22)}
#inputBox:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accentRgb),.14),inset 0 1px 3px rgba(0,0,0,.22)}
#inputBox::placeholder{color:var(--muted2)}
#btnSend{height:46px;flex:0 0 auto;padding:0 24px;border-radius:14px;border:1px solid rgba(255,255,255,.14);cursor:pointer;font-size:14px;font-weight:700;letter-spacing:.5px;
  background:linear-gradient(135deg,#d9b494,#bf9574);color:#2b2018;transition:.18s;box-shadow:0 4px 14px rgba(var(--accentRgb),.26),var(--hairline)}
#btnSend:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 7px 20px rgba(var(--accentRgb),.36),var(--hairline)}
#btnSend:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
#statusLine{font-size:11px;color:var(--accent2);height:14px;margin-top:8px;text-align:center;letter-spacing:.3px}

/* ===== 表情面板 ===== */
#emojiPanel{position:absolute;left:20px;right:20px;bottom:calc(100% + 8px);max-width:520px;margin:0 auto;
  background:linear-gradient(160deg,#312d3b,#25222d);border:1px solid var(--line);border-radius:20px;
  padding:14px 16px 16px;box-shadow:var(--sh3),var(--hairline);z-index:20;display:none}
#emojiPanel.show{display:block}
#emojiPanel .ep-tabs{display:flex;gap:6px;margin-bottom:12px;border-bottom:1px solid var(--lineFaint);padding-bottom:10px}
#emojiPanel .ep-tab{font-size:12px;padding:6px 13px;border-radius:9px;border:1px solid transparent;background:transparent;
  color:var(--muted);cursor:pointer;transition:.15s}
#emojiPanel .ep-tab.on{background:rgba(var(--accentRgb),.16);border-color:rgba(var(--accentRgb),.4);color:var(--accent)}
#emojiPanel .ep-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;max-height:220px;overflow-y:auto}
@media(max-width:520px){#emojiPanel .ep-grid{grid-template-columns:repeat(7,1fr)}}
#emojiPanel .ep-item{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:24px;
  border-radius:10px;cursor:pointer;transition:.12s;user-select:none}
#emojiPanel .ep-item:hover{background:rgba(255,255,255,.1);transform:scale(1.12)}
#emojiPanel .ep-item img{width:100%;height:100%;object-fit:contain;pointer-events:none}
#emojiPanel .ep-item video{width:100%;height:100%;object-fit:cover;pointer-events:none;border-radius:8px}
#emojiPanel .ep-item .vidTag{position:absolute;right:2px;bottom:2px;font-size:9px;background:rgba(0,0,0,.75);color:#fff;padding:0 3px;border-radius:4px}
#emojiPanel .ep-item{position:relative}
#emojiPanel .ep-empty{grid-column:1/-1;text-align:center;color:var(--muted);font-size:12px;padding:22px 8px;line-height:1.7}
#emojiPanel .ep-tip{font-size:11px;color:var(--muted2);margin-top:10px;text-align:center;letter-spacing:.3px}
#btnEmoji{flex:0 0 38px}
/* 深度思考开关：关着是个普通小按钮，开着亮起来 */
#btnDeep{flex:0 0 auto;width:auto;padding:0 11px;transition:.2s;font-size:11.5px;letter-spacing:.6px;font-weight:600}
#btnDeep.on{background:rgba(var(--accentRgb),.26);border-color:rgba(var(--accentRgb),.75);color:var(--accent);
  box-shadow:0 0 0 1px rgba(var(--accentRgb),.3),0 0 16px rgba(var(--accentRgb),.3)}
#btnDeep.on::after{content:"";position:absolute;right:5px;top:5px;width:5px;height:5px;border-radius:50%;background:var(--accent);animation:pulseDot 1.8s infinite}
#btnDeep{position:relative}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.25}}
@media(max-width:520px){#btnDeep{padding:0 8px;font-size:10.5px;letter-spacing:0}#inputRow{gap:6px}}

/* ===== 弹窗 ===== */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,9,14,.78);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;padding:18px}
.overlay.show{display:flex}
.card{width:100%;max-width:560px;max-height:86vh;overflow-y:auto;background:linear-gradient(160deg,#302c3a,#24212c);
  border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:var(--sh3),var(--hairline)}
.card h2{margin:0 0 6px;font-size:20px;font-weight:700;letter-spacing:.5px}
.card .sub{color:var(--muted);font-size:12.5px;margin-bottom:20px;line-height:1.75}
.card h3{font-size:13px;color:var(--accent2);margin:20px 0 10px;letter-spacing:.5px}
.closeBtn{margin-top:22px;width:100%;padding:13px;border-radius:14px;border:1px solid rgba(var(--accentRgb),.5);
  background:rgba(var(--accentRgb),.16);color:#efd2b6;font-size:13px;cursor:pointer;font-weight:700;letter-spacing:.5px;transition:.18s}
.closeBtn:hover{background:rgba(var(--accentRgb),.26)}
.memCard{border:1px solid var(--lineSoft);border-radius:14px;padding:14px;margin-bottom:12px;background:rgba(255,255,255,.03);box-shadow:var(--hairline)}
.memCard .mh{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.memCard .mh .mavatar{width:32px;height:32px;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--line)}
.memCard .mh .mavatar img{width:100%;height:100%;object-fit:cover}
.memCard .mh .mn{font-weight:700;font-size:13px;flex:1}
.memCard .mh .stat{font-size:10px;color:var(--muted)}
.mini{padding:6px 11px;border-radius:9px;border:1px solid var(--lineSoft);background:rgba(255,255,255,.05);color:var(--text2);font-size:11.5px;cursor:pointer;transition:.18s}
.mini:hover{border-color:var(--accent);color:var(--text)}
.memText{font-size:11.5px;color:var(--muted);line-height:1.75;white-space:pre-wrap;max-height:110px;overflow:auto;background:rgba(0,0,0,.26);padding:11px;border-radius:10px;margin-top:10px}
.setRow{display:flex;align-items:center;gap:9px;margin-bottom:10px;font-size:12.5px}
.setRow label{color:var(--muted);flex:0 0 74px}
.setRow input,.setRow select{flex:1;min-width:0;padding:9px 11px;border-radius:10px;border:1px solid var(--lineSoft);background:var(--bg2);color:var(--text);font-size:12px;font-family:inherit;outline:none}
.setRow input:focus,.setRow select:focus{border-color:var(--accent)}
details.member{border:1px solid var(--lineSoft);border-radius:14px;margin-bottom:12px;background:rgba(255,255,255,.03);overflow:hidden}
details.member summary{padding:12px 14px;cursor:pointer;font-size:13px;font-weight:700;display:flex;align-items:center;gap:10px;list-style:none;letter-spacing:.3px}
details.member summary::-webkit-details-marker{display:none}
details.member .inner{padding:0 14px 14px}
details.member .mavatar{width:30px;height:30px;border-radius:10px;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;background:var(--line)}
details.member .mavatar img{width:100%;height:100%;object-fit:cover}

@media(max-width:520px){
  #topbar{height:60px;flex-basis:60px;padding:0 12px;gap:8px}
  .groupAvatar{width:40px;height:40px;flex-basis:40px}
  #chatBox{padding:20px 12px 8px}
  .msg .body{max-width:80%}
  .card{padding:20px}
  #composer{padding:12px 14px 16px}
  #btnSend{padding:0 17px}
}
#targetList .avatarImg{width:28px;height:28px;object-fit:cover;object-position:top;border-radius:10px;display:block}

</style>
</head>
<body>
<div id="aurora"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div></div>
<div id="stars"></div>

<div id="app">
  <div id="topbar">
    <div class="groupAvatar" id="groupAvatar" onclick="pickMyAvatar()" title="点一下，换头像"><img data-sc="1" onerror="this.style.display='none'" src="home.jpg" alt=""></div>
    <div class="titles"><span class="gname" style="font-size:16.5px">三人行</span><span class="gsub" id="spendInfo"></span></div>
  </div>

  <div id="chatBox"></div>

  <div id="composer" style="position:relative">
    <div id="emojiPanel">
      <div class="ep-tabs"><button class="ep-tab on" data-tab="emoji">😀 表情</button><button class="ep-tab" data-tab="pack">🖼️ 表情包</button></div>
      <div class="ep-grid" id="epGrid"></div>
      <div class="ep-tip" id="epTip">点一下插入输入框</div>
    </div>
    <div id="attachRow"></div>
    <div id="inputRow">

/* ===== 自动更新探测：绕开浏览器缓存，发现新版就自动刷新一次 ===== */
(function(){
  try{
    const done=sessionStorage.getItem("verChecked_"+APP_VER);
    if(done)return;

        const m=t.match(/const APP_VER="([^"]+)"/);

      })
      .catch(()=>{});
  }catch(e){}
})();

/* z114：预连接。head 里那条只盖默认域名；接口换成自己的代理时，这里补一条。去重，重复调用不产生额外连接。 */
const _preLinked={};
function preconnect(url){
  try{
    const u=new URL(String(url||""));
    if(u.protocol!=="https:"&&u.protocol!=="http:")return;
    const origin=u.origin;
    if(_preLinked[origin])return;
    _preLinked[origin]=1;
    const l=document.createElement("link");l.rel="preconnect";l.href=origin;l.crossOrigin="anonymous";
    (document.head||document.documentElement).appendChild(l);
    const d=document.createElement("link");d.rel="dns-prefetch";d.href=origin;
    (document.head||document.documentElement).appendChild(d);
  }catch(e){}
}
function preconnectMembers(){
  try{(members||[]).forEach(m=>{if(m&&m.url)preconnect(m.url);});}catch(e){}
  preconnect(SF_URL);
}

function pickMyAvatar(){
  try{
    const inp=document.createElement("input");
    inp.type="file";inp.accept="image/*";
    inp.onchange=()=>{
      const f=inp.files&&inp.files[0];if(!f)return;
      const url=URL.createObjectURL(f);
      const img=new Image();
      img.onload=()=>{
        try{
          const c=document.createElement("canvas");c.width=128;c.height=128;
          const s=Math.min(img.width||128,img.height||128);
          c.getContext("2d").drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,128,128);
          myAvatarData=c.toDataURL("image/jpeg",0.85);
          try{localStorage.setItem(LS_MY_AVATAR,myAvatarData);}
          catch(e){sysMsg("这张图存不进本地（太大了），换张小图试试");}
          refreshMyAvatars();
          sysMsg("头像换好了，只存在你自己这台设备上。");
        }catch(e){sysMsg("换头像失败："+e.message);}
        URL.revokeObjectURL(url);
      };
      img.onerror=()=>{sysMsg("这张图读不出来，换一张试试");URL.revokeObjectURL(url);};
      img.src=url;
    };
    inp.click();
  }catch(e){sysMsg("换头像失败："+e.message);}
}

/* IndexedDB：手机清"网站数据/缓存"通常清 localStorage，但 IDB 往往能活下来，多一道保险 */
function idbKv(){return new Promise(res=>{try{const r=indexedDB.open("xiaojia",1);r.onupgradeneeded=()=>{try{r.result.createObjectStore("kv");}catch(e){}};r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);}catch(e){res(null);}});}
function idbSet(k,v){if(typeof indexedDB==="undefined")return;idbKv().then(db=>{if(!db)return;try{db.transaction("kv","readwrite").objectStore("kv").put(v,k);}catch(e){}}).catch(()=>{});}
function idbGet(k){if(typeof indexedDB==="undefined")return Promise.resolve("");return idbKv().then(db=>{if(!db)return"";return new Promise(res=>{try{const q=db.transaction("kv","readonly").objectStore("kv").get(k);q.onsuccess=()=>res(q.result||"");q.onerror=()=>res("");}catch(e){res("");}});}).catch(()=>"");}
function writeKeyEverywhere(k){
  try{localStorage.setItem(KEY_STORAGE,k);}catch(e){}
  try{localStorage.setItem(KEY_BAK,k);}catch(e){}
  try{document.cookie="ai_k="+encodeURIComponent(k)+";path=/;max-age=31536000;SameSite=Lax";}catch(e){}
  idbSet("key",k);
}
function readKeyCookie(){
  try{const m=String(document.cookie||"").match(/(?:^|;\s*)ai_k=([^;]*)/);return m?decodeURIComponent(m[1]):"";}catch(e){return "";}
}
function loadKey(){

  if(!KEY){try{KEY=pick(localStorage.getItem(KEY_STORAGE));}catch(e){KEY="";}}
  if(!KEY){try{KEY=pick(localStorage.getItem(KEY_BAK));}catch(e){}}          // 二级：备份项
  if(!KEY){KEY=pick(readKeyCookie());}                                        // 三级：cookie
  // 四级：兼容旧版本，本机老数据里成员自带钥匙
  if(!KEY){try{const s=localStorage.getItem(LS);if(s){const a=JSON.parse(s);if(Array.isArray(a))for(const m of a){const k=pick(m&&m.key);if(k){KEY=k;break;}}}}catch(e){}}

}

}

/* 人设抽签：权重全部对等，21 张牌各 1 份（各约 4.8%），一碗水端平 */
function drawRP(mode){
  /* mode="chain"：接龙只抽"能接话"的牌；mode="soft"：他状态不高时只抽"能好好说话"的牌 */
  const list0=(mode==="chain")?RPPOOL.filter(r=>r.chainOk):(mode==="soft")?RPPOOL.filter(r=>r.softOk):RPPOOL;
  const list=list0.length?list0:RPPOOL;
  let total=0;list.forEach(r=>total+=(r.weight||1));
  let x=Math.random()*total;
  for(const r of list){x-=(r.weight||1);if(x<0)return r;}
  return list[list.length-1];
}

/* z72：给模型一批候选梗自己判断——先按用户这句话做语义预筛（说得上的排前面），再随机补足；模型自己挑，不贴就不甩 */
function pickMemeCandidates(text,exclude,n){
  const s=String(text||"");
  const recent=recentMemes.slice(-12);
  const base=sharedMemes.filter(x=>(exclude||[]).indexOf(x)<0);
  /* 语义预筛：把用户这句话里的词（2字以上）跟梗文本比对，命中的排前面 */
  const words=[];
  for(let i=0;i<s.length-1;i++){
    const w=s.slice(i,i+2);
    if(/[\u4e00-\u9fa5a-zA-Z0-9]/.test(w[0])&&!/[，。！？、\s]/.test(w))words.push(w);
  }
  const scored=base.map(m=>{
    let sc=0;
    const ks=MEME_KEYS[m];
    if(ks&&ks.length){
      /* z115：有标注的梗只认关键词。命中一个 +6，压过字面重合；一个不沾就是 0 分，不靠字面硬凑 */
      for(const k of ks){if(k&&s.indexOf(k)>=0)sc+=6;}
    }else{
      /* 没标注的（用户自己加的梗）：退回原来的二字重合 */
      for(const w of words){if(m.indexOf(w)>=0)sc+=2;}
    }
    if(recent.indexOf(m)>=0)sc-=3;
    return {m,sc};
  });
  scored.sort((a,b)=>b.sc-a.sc);
  const picked=[];
  /* z112：只给沾边的，一条都不沾就一条都不给——宁可不玩梗，也不塞不相关的东西。
     以前不够 n 条就随机补满，用户说「好悠哉啊」梗库里一个字都不沾，塞进去的全是随机的。 */
  for(const o of scored){if(o.sc>0&&picked.length<Math.min(n||3,3)){picked.push(o.m);}}
  /* B3修复：把这次选中的记进 recentMemes，跨轮防重复才真正生效 */
  picked.forEach(c=>{if(recentMemes.indexOf(c)<0)recentMemes.push(c);});
  if(recentMemes.length>24)recentMemes=recentMemes.slice(-24);
  try{localStorage.setItem(LS_MEMES+"_recent",JSON.stringify(recentMemes));}catch(e){}
  return picked;
}
/* z108：表情包清单以前 16 个全塞进提示词（648 字，占一轮三分之一）。
   现在前端先按他这句话挑 6 个贴题的（跟挑梗一个思路：二字词重合打分），再让模型从这 6 个里选一个用。 */
function pickPackCandidates(text,n){
  n=n||6;
  const s=String(text||"");
  const words=[];
  for(let i=0;i<s.length-1;i++){
    const w=s.slice(i,i+2);
    if(/[\u4e00-\u9fa5]/.test(w[0])&&!/[，。！？、\s]/.test(w))words.push(w);
  }
  const scored=CUSTOM_PACK.map((p,i)=>{
    let sc=0;
    const ks=PACK_KEYS[p.file];
    if(ks&&ks.length){
      for(const k of ks){if(k&&s.indexOf(k)>=0)sc+=6;}   /* z115：关键词优先 */
    }else{
      for(const w of words){if(String(p.hint||"").indexOf(w)>=0)sc+=2;}
    }
    return {p,i,sc};
  });
  scored.sort((a,b)=>b.sc-a.sc);
  const hit=scored.filter(x=>x.sc>0).slice(0,n);
  const rest=scored.filter(x=>x.sc<=0);
  const picked=hit.slice();
  while(picked.length<n&&rest.length){
    picked.push(rest.splice(Math.floor(Math.random()*rest.length),1)[0]);
  }
  picked.sort((a,b)=>a.i-b.i);   /* 按原顺序排回去，{{eN}} 编号才对得上图 */
  return picked;
}

/* z108：记忆是"· 一条一句"的文本，以前超长直接 slice(0,N) —— 会从半句话中间切断
   （"他喜欢喝冰美式，不加"）。改成按整条给：宁可少一条，也不给断句。 */
function clipMem(txt,limit){
  const s=String(txt||"");
  if(s.length<=limit)return s;
  const lines=s.split("\n");
  let out="";
  for(const l of lines){
    if((out?out+"\n":"").length+l.length>limit)break;
    out=out?out+"\n"+l:l;
  }
  return out||s.slice(0,limit);
}

/* ===== z116：三人共用一份"聊过什么" =====
   以前每个 AI 各自滚 gist：同一批用户发言被摘要三遍，而且三人对"聊过什么"的版本还不一致
   （谁先被 trim 谁先记）。现在群聊合成一份；私聊的摘要仍留在自己那条线上，不混进群聊。
   注意：这不会省 API 钱——三个请求各自都要带这段上下文，省的是存储和"记忆对不齐"。 */
const LS_GIST="ai_shared_gist_v1";

  if(done)return;
  /* 老存档：把三个人手里各自那份 gist 并成一份，然后清掉各自那份（只做一次） */
  try{
    const parts=sharedGist?sharedGist.split("；").filter(Boolean):[];
    (members||[]).forEach(m=>{
      if(!m||!m.gist)return;
      String(m.gist).split("；").forEach(x=>{x=x.trim();if(x&&parts.indexOf(x)<0)parts.push(x);});
      delete m.gist;
    });

  }catch(e){}
}
function trimHist(m,max){
  max=max||10;
  if(!m||!Array.isArray(m.history)||m.history.length<=max)return;
  const drop=m.history.splice(0,m.history.length-max);
  const said=drop.filter(h=>h.role==="user")
    .map(h=>String(h.content||"").replace(/\s+/g," ").trim().slice(0,24))
    .filter(Boolean);
  if(!said.length)return;
  if(privateWith&&m===privateWith){
    /* 私聊：摘要只留在这一条线上，绝不混进群聊 */
    m.gist=((m.gist||"")+"；"+said.join("；")).replace(/^；+/,"").slice(-140);
  }else{
    addGist(said);   /* 群聊：三个人共一份，不再各滚各的 */
  }
}

function isLowMood(t){

function isHeartfelt(t){
  const s=String(t||"").trim();if(!s)return false;
  const plain=s.replace(/\s/g,"");
  const sig=["心事","心里话","心里","难受","难过","委屈","孤独","孤单","想念","想哭","崩溃","撑不住","失眠","没意思","没意义","活着","活着没劲","自卑","没用","废物","失败","后悔","遗憾","对不起","抱歉","害怕","担心","在乎","陪伴","倾诉","喜欢一个人","出柜","同性恋","gay","GAY","男同","男朋友","女朋友","被骂","被开除","离职","辞职","好累","太累","真的累","有点累","累了","疲惫","身心俱疲","烦死","emo","抑郁","情绪","低落","空虚","没人懂","没人在乎","不被看见","憋屈","心酸","眼泪","哭了","想逃","逃离","压力","迷茫","焦虑","撑不下去","坚持不住","没有爱","感受不到","活得很开心","伤心","心痛","心累","想死","想消失","该死","不值得","没救","活不下去","不想活","无助","绝望","麻木","空落落","讨厌自己","自责","内疚","丢人","羞耻","没人要","被抛弃","倒霉","好烦","心烦","快崩了","心凉","窝火","融不进去","格格不入","我是认真的","我是说真的","认真的","正经点","严肃点","说正事","别闹了","不要闹了","不要玩闹了","别玩闹了","别玩了","不玩了","收一收"];
  if(sig.some(w=>s.indexOf(w)>=0))return true;
  // 长句第一人称 + 情绪/状态叙述，也算心声
  // 第一人称 + 负面情绪词，也直接算心声（"我是不是很该死""我好伤心"这类）
  const neg=["伤心","心痛","难受","想死","该死","绝望","无助","想哭","崩了","撑不住","好烦","心烦","委屈","自卑","废物","没用","讨厌自己","没意思","孤独","一个人","没人在乎","融不进"];
  if(/(我|自己)/.test(s)&&neg.some(w=>s.indexOf(w)>=0))return true;
  // 长句第一人称 + 情绪/状态叙述，也算心声
  if(plain.length>=12&&/(我|自己|最近|一直|总是|感觉|觉得)/.test(s)&&/(其实|好像|不知道|为什么|怎么|真的|特别|越来越|有点|挺|没人|没有|是不是)/.test(s))return true;
  return false;
}

function sanitizeHistory(){
  let cleaned=0;
  /* 复读消毒：同一个人历史里一字不差的重复发言，只留最新一条 */
  members.forEach(m=>{
    const seen=new Map();
    m.history=m.history.filter(h=>{
      if(h.role!=="assistant")return true;
      /* 模糊键：去掉开头的语气词（"嘿？""哈哈"）再比，抓变体复读 */
      const k=String(h.content||"").trim().replace(/^.*?[?？!！。]/,"").trim()||String(h.content||"").trim();
      if(seen.has(k)){seen.set(k,seen.get(k)+1);cleaned++;return false;}
      seen.set(k,1);return true;
    });
  });
  return cleaned;
}

/* ===== z94：全局播放队列 =====
   三个模型仍然同时思考（三个请求同一瞬间并发），但谁先想好谁先说——不排座次、不轮转。
   所有句子进同一条播放线，严格按到达顺序一条一条蹦，句间留呼吸感：
   没人能一口气把三条糊在你脸上，也不会有人因为"轮不到"而被按着头等前面的人说完。
   一直不换行的长段落仍退回逐字打字机——此时该角色像"正在输入"，别人照常发言。 */
const groupPlayer={views:{},order:[],pumping:false,waiters:[],lineup:[],spoken:[],played:[]};
function groupDupNorm(x){return String(x).replace(/[，。！？!?,.、～~\s]/g,"");}
function groupIsDup(txt){
  const x=groupDupNorm(txt);if(!x)return false;
  const spoken=groupPlayer.spoken||(groupPlayer.spoken=[]);
  return spoken.some(y=>{
    const z=groupDupNorm(y);if(!z)return false;
    if(x===z)return true;
    if(x.length<=6||z.length<=6)return x.indexOf(z)>=0||z.indexOf(x)>=0;   /* 短句互相包含也算撞 */
    return false;
  });
}
function groupReset(names){
  groupPlayer.views={};groupPlayer.order=names.slice();
  groupPlayer.pumping=false;groupPlayer.waiters=[];groupPlayer.lineup=[];groupPlayer.spoken=[];groupPlayer.played=[];
}
function groupAllDone(){
  if(groupPlayer.lineup.length)return false;
  return groupPlayer.order.every(k=>{
    const v=groupPlayer.views[k];
    return !v||v._done;   /* 还没进场的角色不拖住全场：插队台词在等门闩，不能把起头的人卡死 */
  });
}
function groupNext(){
  return groupPlayer.lineup.length?groupPlayer.lineup.shift():null;   /* 先到先得，谁先想好谁先说 */
}
function groupPump(){
  if(groupPlayer.pumping)return;
  const it=groupNext();
  if(!it){
    if(groupAllDone()&&groupPlayer.waiters.length){
      const ws=groupPlayer.waiters;groupPlayer.waiters=[];ws.forEach(w=>w());
    }
    return;
  }
  groupPlayer.pumping=true;
  it.view._render(it.txt);
  setTimeout(()=>{groupPlayer.pumping=false;groupPump();},200+Math.random()*180);
}
function groupEnqueue(key,txt,view){
  groupPlayer.views[key]=view;   /* 双保险：就算构造后被 reset，入队时重新认领 */
  if(!view._allow&&groupIsDup(txt))return;   /* 同轮撞车——后面想出同样话的人闭嘴；抽中应声虫等复读牌的角色豁免 */
  groupPlayer.spoken.push(txt);
  groupPlayer.lineup.push({txt,view});
  groupPump();
}
function groupDrain(){
  if(groupAllDone()&&!groupPlayer.pumping){
    if(groupPlayer.waiters.length){const ws=groupPlayer.waiters;groupPlayer.waiters=[];ws.forEach(w=>w());}
    return Promise.resolve();
  }
  return new Promise(r=>{groupPlayer.waiters.push(r);groupPump();});
}
/* z107：模型有时候一口气写一长段不带换行，全堆在一个大气泡里。
   这里把超过 18 字的一段按句末标点再拆开，一句一条，更像微信连发。 */
function splitLong(txt,n){
  n=n||18;
  const t=String(txt||"").trim();
  if(!t)return [];
  if(t.length<=n)return [t];
  const raw=t.match(/[^。！？!?；;…]+[。！？!?；;…]*/g)||[t];
  const out=[];let cur="";
  for(let i=0;i<raw.length;i++){
    const p=raw[i];
    if(p.length>n*2){              /* 单句太长又没标点 → 再按逗号拆 */
      if(cur){out.push(cur);cur="";}
      const cs=p.match(/[^，,、]+[，,、]*/g)||[p];
      let c2="";
      for(let k=0;k<cs.length;k++){
        if(!c2)c2=cs[k];
        else if((c2+cs[k]).length<=n)c2+=cs[k];
        else{out.push(c2);c2=cs[k];}
      }
      if(c2)cur=c2;
      continue;
    }
    if(!cur)cur=p;
    else if((cur+p).length<=n+8)cur+=p;
    else{out.push(cur);cur=p;}
  }
  if(cur)out.push(cur);
  return out.length?out:[t];
}
function makeStreamView(m,lazy,key,allowDup){
  let buf="",typing=false,born=Date.now(),shown=0,lastSh=null;
  function nextSh(){
    if(!lastSh){lastSh=lazy.ensure();}
    else{lastSh=aiMsgShell(m);lastSh.el.classList.add("spoke");setTimeout(()=>lastSh.el.classList.remove("spoke"),750);}
    return lastSh;
  }
  function typeIt(full){
    const sh=lazy.ensure();
    sh.bubble.innerHTML=renderMdLite(String(full).split("\n")[0])+'<span class="typingDot">…</span>';
    scrollBottom();
  }
  const view={
    get sent(){return !!lastSh;},   /* 已经蹦出过气泡了：被打断时别把说出的话收回去 */
    _done:false,
    _allow:!!allowDup,   /* 抽中复读类牌（应声虫）时同轮撞句不丢——复读就是他的戏 */
    _render(txt){
      const sh=nextSh();
      sh.bubble.innerHTML=renderMdLite(txt);
      (groupPlayer.played||(groupPlayer.played=[])).push({n:key,t:String(txt)});   /* z111：真播到屏幕上的才算数 */
      scrollBottom();
    },
    push(partial){
      const full=String(partial||"");
      if(typing){typeIt(full);return;}
      buf=full;
      const lines=full.split("\n");
      const doneLines=/\n\s*$/.test(full)?lines.length:lines.length-1;
      let segs=lines.slice(0,Math.max(0,doneLines)).map(x=>x.trim()).filter(Boolean);
      segs=segs.reduce((a,x)=>a.concat(splitLong(x)),[]);   /* z107：长段落自动拆成一条一句 */
      while(shown<segs.length){groupEnqueue(key,segs[shown],view);shown++;}
      if(!shown&&Date.now()-born>800){typing=true;typeIt(full);}   /* 0.8秒还没吐出第一整句 → 退回打字机（提前冒头） */
    },
    async finish(full){
      if(typing){
        const sh=lazy.ensure();
        sh.bubble.innerHTML=renderMdLite(String(full||buf));
        (groupPlayer.played||(groupPlayer.played=[])).push({n:key,t:String(full||buf)});   /* z111：打字机模式同样记账 */
        scrollBottom();this._done=true;groupPump();return sh;
      }
      const src=(full===undefined||full===null)?buf:String(full);
      let segs=src.split(/\n+/).map(x=>x.trim()).filter(Boolean);
      segs=segs.reduce((a,x)=>a.concat(splitLong(x)),[]);   /* z107：收尾也拆，长句不留大气泡 */
      this._done=true;
      if(segs.length){
        while(shown<segs.length){groupEnqueue(key,segs[shown],view);shown++;}
        await groupDrain();   /* 等全队播完：一条一条蹦的节奏就来自这里 */
      }else{
        groupPump();   /* 一句都没入队（空回复/全被查重丢掉）也要叫醒等着的人，否则卡死 */
      }
      return lastSh;   /* 一句都没播出来（被同轮查重丢光）→ 返回 null，不建空气泡 */
    }
  };
  groupPlayer.views[key]=view;
  return view;
}
function renderMdLite(t){
  let s=esc(t);
  s=s.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
  s=s.replace(/`([^`]+)`/g,'<code style="background:#0e1122;padding:1px 5px;border-radius:5px;font-size:12px;color:var(--accent2)">$1</code>');
  /* AI 写的隐藏表情标记 {{eN}} -> 真表情包；认不出就抹掉，不把标记露出来 */
  s=s.replace(/\{\{e(\d+)\}\}/g,(full,n)=>{
    const p=CUSTOM_PACK[parseInt(n,10)-1];
    if(!p)return "";
    const u=scSuffix("emojis/"+p.file);
    const kind=p.type||stickerKind(p.file);
    return kind==="video"
      ? `<video class="stickerVid" src="${u}" autoplay loop muted playsinline></video>`
      : `<img class="stickerImg" src="${u}" alt="">`;
  });
  return s;
}

async function callModel(m,userText,atts,ctx,onChunk){
  const url=(m.url||"").replace(/\/+$/,"")+"/chat/completions";
  const pk=String(m.avatar||"").slice(4).split("|")[0];
  const heartfelt=!!(ctx&&ctx.heartfelt);

     固定前缀（人设 → 总规矩 → 场景规则 → 表情 → 记忆）放最前、每轮不变；
     每轮都在变的（别重复 / 候选梗 / 最后一句 / 私聊标记）统一挪到最后。
     前缀稳定 = 供应商的上下文缓存能命中，prefill 少算一大半，首字更快，还省钱。 */
  const messages=[{role:"system",content:persona}];
  messages.push({role:"system",content:RULE_CORE});
  const isChain=!!(ctx&&ctx.chain);
  const isPrivate=!!(ctx&&ctx.private);
  if(heartfelt)messages.push({role:"system",content:RULE_HEART});
  else if(isChain)messages.push({role:"system",content:RULE_PLAY});
  else if(ctx&&ctx.soft)messages.push({role:"system",content:RULE_SOFT});
  else if(!(ctx&&ctx.intro))messages.push({role:"system",content:RULE_CHAT});
  /* 记忆按场景给：玩梗不翻旧账，只带长期事实 + 记忆开头一小段（够认出他是谁）；
     认真 / 私聊 / 初见 / 接龙 才带全量。省下的一千多字换算成首字速度。 */
  if(longMem)messages.push({role:"system",content:`【关于{{NAME}}的长期事实·他认真说过的、记住别忘】\n${longMem}`});
  if(sharedMem){
    /* z106：深度模式的输入费是大头（大模型输入价是快模型的 10 倍）。
       记忆开头就是他这个人是谁 + 长期事实，800 字够认得他；私聊/接龙/初见仍带全量，那几种不能丢上下文。 */
    let memShow;
    if(isPrivate||isChain||!!(ctx&&ctx.intro))memShow=sharedMem;
    else if(heartfelt)memShow=sharedMem.length<=800?sharedMem:(clipMem(sharedMem,800)+"…");
    else memShow=sharedMem.length<=400?sharedMem:(clipMem(sharedMem,400)+"…");
    messages.push({role:"system",content:`【三人共用的记忆·用来更懂{{NAME}}，别像查户口一样主动摊开说】\n${memShow}`});
  }
  /* ===== 以下每轮都在变，统一放最后，护住上面的固定前缀 ===== */
  {
    let emoRule;
    if(heartfelt){
      emoRule="现在他在讲正经事或心里话：基本不用表情，最多一个很软的 emoji(比如 🥺🫶)，不要用表情包。";
    }else if((ctx&&ctx.emojiMode)==="pack"&&CUSTOM_PACK.length){
      /* z108：只给他这句话贴得上的 6 个（前端挑好传进来），不再 16 个全给 */
      const pick=(ctx&&ctx.packPick&&ctx.packPick.length)?ctx.packPick:CUSTOM_PACK.map((p,i)=>({p,i}));
      const list=pick.map(o=>"{{e"+(o.i+1)+"}}="+o.p.hint).join("；");
      emoRule="这一轮用【表情包】：回复里大约每两句话带一个表情包，把对应标记原样插进那句话里就行(比如 '笑死{{e2}}')。可选表情包只有这些："+list+"。必须贴着当前场景挑，相关才用，不相关宁可一个都不带。一次最多一个，别连着堆。只输出标记本身，不要解释、不要把 hint 的文字写出来。";
    }else{
      emoRule="这一轮用【emoji】：像真人发微信，回复里大约每两句话顺手带一个 emoji(比如 哈哈哈😂、真的假的🤔、冲🐶)，贴着场景用，相关才带、不相关别硬塞。一次最多一个，别堆一串，别用 ❌✅ 这种机器人符号。";
    }
    messages.push({role:"system",content:"【表情规则】"+emoRule});
  }
  /* z108：之前聊过的（历史被折叠掉的旧话），别装不记得 */
  /* z116：群聊读共享摘要；私聊读自己那条线的 */
  {
    const gistShow=isPrivate?m.gist:sharedGist;
    if(gistShow)messages.push({role:"system",content:"【之前聊过、别装不记得】"+gistShow});
  }
  /* z108：群里别人刚说的话，单独一份（带说话人名字），别跟"他说的"混在一起。
     私聊和接龙不用：私聊是单独对话，接龙已经有【最后一句】。 */
  if(!isPrivate&&!isChain&&typeof groupFlow!=="undefined"&&groupFlow.length){
    const others=groupFlow.filter(x=>x.n!==m.name);
    if(others.length)messages.push({role:"system",content:"【群里刚说的话·名字是说话的人·别当成是他说的】"+others.map(x=>x.n+"："+x.t).join(" / ")});
  }
  const recentLines=recentReplies.slice(-6);
  if(recentLines.length)messages.push({role:"system",content:"【别重复】最近说过的别再说："+recentLines.join("；")+"。"});
  if(ctx&&ctx.norepeat)messages.push({role:"system",content:"【警告】你上一条回复跟之前撞车了，这次必须换一个完全不同的新说法。"});
  if(ctx&&ctx.noban)messages.push({role:"system",content:"【严重警告】你上一条回复提了不该提的私人老梗。这次回复绝对不许出现任何老梗词汇，就事论事，只回应当前这句话本身。"});
  if(ctx&&ctx.intro)messages.push({role:"system",content:"【第一次见面】"+(profile&&profile.name?("你们刚认识，你已经知道他叫"+profile.name+"了，叫名字没问题，但别装熟、别提以前聊过什么。"):"你们三个刚认识他，还不知道他叫什么——绝对别叫他任何名字、别装熟、别提以前聊过什么。")+"用你自己的性格自然打个招呼（一两句，可以顺带一句自我介绍），然后只问他一个问题："+ctx.intro+"　一次只问这一个，别一口气问好几个，别列点。"});
  if(ctx&&ctx.private)messages.push({role:"system",content:"【私聊模式】现在是你和{{NAME}}的单独对话，不是群聊。记录里可能有之前群聊的内容，只针对当前私聊这句回，按你的性格正常说话。"});
  /* 本轮人设牌 + 候选梗：玩梗/接龙才发，认真模式一条都不发 */
  if(!heartfelt){
    const rp=(ctx&&ctx.rp)||null;
    let pool=(ctx&&ctx.memes)||[];
    /* z105：梗里可以写 {U} —— 发出去之前换成用户称呼，这样"XX开播了"能贴着人喊 */
    if(pool.length)pool=pool.map(x=>String(x).replace(/\{U\}/g,userName()));
    if(isChain){
      const lastUser=[...m.history].reverse().find(h=>h.role==="user");
      const lastLine=(ctx&&ctx.lastLine)?String(ctx.lastLine).slice(0,120):(lastUser?String(lastUser.content).slice(0,120):"");
      let cmd="";
      if(rp)cmd+="【本轮人设·"+rp.name+"】"+rp.desc+"——完全按这个身份接这句话，别解释人设定义本身。";
      if(pool.length)cmd+="【跟梗·贴得上才用】候选梗有："+pool.map((x,i)=>(i+1)+"「"+x+"」").join("、")+"。这些只是句式模板：只有跟最后那句直接对得上的，才借它的句式套上去说；一条都不贴就一个梗都别提（提了算错）。别报编号别解释。";
      messages.push({role:"system",content:"【接龙·玩梗时间】必须贴着最后那句话接——拿着抽中的人设牌，贴着它说，别答非所问。"+cmd+"只玩真说过的事，绝不编新剧情新约定；一般一两句、允许只有两三个字，别提「接龙」二字。"+(lastLine?"【最后一句】"+lastLine:"")+((ctx&&ctx.said&&ctx.said.length)?"【这轮已经说过、绝不重复】"+ctx.said.join(" / "):"")+RULE_NOFAB});
    }else if(rp||pool.length){
      let cmd="";
      if(rp)cmd+="【本轮人设·"+rp.name+"】"+rp.desc+"——完全按这个身份贴合他这句话的场景说话，别解释人设定义本身。";
      if(pool.length)cmd+="【跟梗·贴得上才用】候选梗有："+pool.map((x,i)=>(i+1)+"「"+x+"」").join("、")+"。这些只是句式模板：只有跟{{NAME}}这句直接对得上的，才借它的句式套在他说的事上说；一条都不贴就一个梗都别提（提了算错），绝不硬凑、绝不换掉他的话题。别解释梗、别报编号。";
      messages.push({role:"system",content:cmd+RULE_NOFAB});
    }
  }
  /* 给别人用时，把提示词里的"用户"换成他自己的名字 */
  for(let i=0;i<messages.length;i++){
    if(messages[i].role==="system"&&typeof messages[i].content==="string")messages[i]={role:"system",content:localize(messages[i].content)};
  }
  m.history.forEach(h=>messages.push(h));
  /* z87：日常走快模型，认真模式才用大模型 */
  const useModel=heartfelt?MODEL_HEART:MODEL_FAST;
  const canSee=isVision(useModel);
  const parts=canSee?attParts(atts):[];
  if(parts.length)messages.push({role:"user",content:[{type:"text",text:userText||"看看我发的画面，用你自己的性格说说看法"},...parts]});
  else if(atts&&atts.length)messages.push({role:"user",content:(userText?userText+" ":"")+((ctx&&ctx.imgDesc)?"（{{NAME}}发了张图，画面上是："+ctx.imgDesc+"。就着这个自然接话——别假装亲眼看了图，别提「转述」这两个字）":"（{{NAME}}发了张图，但这次没看清内容，别装看见，自然接一句就行）")});
  /* 接龙也不塞假引子：最后一条真实对话 + 【最后一句】已经说清楚了 */
  /* 普通发话：这句话已经在他的历史里了，不再追加一遍（重复会被模型当成强调指令，回复变硬） */
  const bodyObj={model:useModel,messages,temperature:heartfelt?0.8:0.95,max_tokens:heartfelt?260:55,
    /* z84：enable_thinking 是 Qwen/GLM/DeepSeek 系专有参数，只给认它的模型带（不认的会 400） */
    ...((/glm|qwen|deepseek/i.test(String(useModel)))?{chat_template_kwargs:{enable_thinking:false}}:{}),
    stream:true,stream_options:{include_usage:true}};
  /* 自动重试：短时限流/服务器忙(5xx)/超时/断网 → 等一两秒再来，最多3次。
     但「配额耗尽型429」(原文带重置时间/额度用尽/超出频率限制)和密钥/余额等400错误不重试——重试也是白打，直接把原文报清楚，
     免得一句话撞上限流就连打三次、刷三行错。 */
  let resp=null,lastErr=null,ctl=null,tmr=null,hard=null;
  /* 超时分三层，别再一刀切 45 秒：
     ① 等响应头 60 秒（三人并发时服务端排队很正常）
     ② 流式"空闲"30 秒——每收到一块数据就重新计时，只要还在吐字就绝不掐
     ③ 硬上限 180 秒，防彻底挂死（真回复几十上百字也用不到这么长）
     以前是"从发出请求起 45 秒不管在不在吐字都掐"，模型慢一点就误杀，才会五句两句说不想说话。 */
  for(let attempt=0;attempt<3;attempt++){
    /* B2修复：ctl 活到整个请求（含逐字流读取）结束，打断/超时在吐字阶段也有效 */
    const c=new AbortController();ctl=c;runCtrls.add(c);
    c.__arm=ms=>{if(tmr)clearTimeout(tmr);tmr=setTimeout(()=>{try{c.abort();}catch(e){}},ms);};
    c.__arm(60000);                                              /* ① 等响应头 */
    if(hard)clearTimeout(hard);
    hard=setTimeout(()=>{try{c.abort();}catch(e){}},180000);      /* ③ 硬上限 */
    try{
      resp=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+m.key},
        body:JSON.stringify(bodyObj),signal:ctl.signal});
    }catch(e){
      const userAbort=!!(ctl&&ctl.__userAbort);
      clearTimeout(tmr);if(hard){clearTimeout(hard);hard=null;}
      runCtrls.delete(ctl);ctl=null;resp=null;
      if(userAbort)throw new Error("__cancel");
      lastErr=new Error(e.name==="AbortError"?"__quiet":"网络请求失败："+e.message);
    }
    if(resp&&resp.ok)break;
    if(resp&&!resp.ok){
      let detail="";try{const j=await resp.json();detail=j.error?.message||j.message||"";}catch(e){}
      /* z104：429 分两种，别再一律当配额耗尽。
         真配额耗尽：带"重置时间/额度用尽/余额不足" → 重试白打，直接报。
         短时限流：rate limit / 并发超限 / 上游负载饱和 → 必须退避重试。
         以前一律直接抛错，三个人同时打就被服务端拒掉——这才是"一聊就报错"的主因。 */
      const quotaGone=resp.status===429
        &&/重置|额度已用尽|额度用尽|余额不足|欠费|quota exceeded|每日上限|日限额/i.test(detail)
        &&!/rate.?limit|负载|饱和|并发|稍后再试|too many|temporar/i.test(detail);
      if(resp.status===401||resp.status===403)askKeyAgain();   /* z88：钥匙失效 → 直接把重填框放出来 */
      const noRetry=resp.status<500&&resp.status!==429; // 401/402/403/404 等，重试没用
      if(quotaGone||noRetry)throw new Error(`HTTP ${resp.status}${detail?"："+detail.slice(0,200):""}`);
    }
    if(attempt<2)await new Promise(r=>setTimeout(r,1400*(attempt+1))); // z104：等1.4s、2.8s再试（并发撞限流需要缓一下）
  }
  if(!resp||!resp.ok){
    if(tmr){clearTimeout(tmr);tmr=null;}
    if(hard){clearTimeout(hard);hard=null;}
    if(ctl){runCtrls.delete(ctl);ctl=null;}
    if(lastErr&&!resp)throw lastErr;
    let detail="";try{const j=await resp.json();detail=j.error?.message||j.message||"";}catch(e){}
    throw new Error(`HTTP ${resp?.status||"?"}${detail?"："+detail.slice(0,200):""}`);
  }
  /* 流式：边生成边回调，界面逐字冒出来；最后仍返回完整文本，其它逻辑不变 */
  let full="",usage=null,cutReason="";
  if(resp.body&&resp.body.getReader){
    const reader=resp.body.getReader(),dec=new TextDecoder();
    let buf="";
    try{
      while(true){
        const {done,value}=await reader.read();
        if(done)break;
        if(ctl&&ctl.__arm)ctl.__arm(30000);   /* ② 还在吐字 → 空闲计时清零，只要不哑火就一直等 */
        buf+=dec.decode(value,{stream:true});
        let nl;
        while((nl=buf.indexOf("\n"))>=0){
          const line=buf.slice(0,nl).trim();buf=buf.slice(nl+1);
          if(!line.startsWith("data:"))continue;
          const payload=line.slice(5).trim();
          if(payload==="[DONE]")continue;
          let j;try{j=JSON.parse(payload);}catch(e){continue;}
          if(j.usage)usage=j.usage;
          const fr=j.choices?.[0]?.finish_reason;
          if(fr)cutReason=fr;   /* z107：记下结束原因，length=字数到顶被硬掐 */
          const d=j.choices?.[0]?.delta?.content||j.choices?.[0]?.message?.content||"";
          if(d){full+=d;if(typeof onChunk==="function")onChunk(full);}
        }
      }
    }catch(e){
      if(ctl&&ctl.__userAbort){if(tmr){clearTimeout(tmr);tmr=null;}if(hard){clearTimeout(hard);hard=null;}if(ctl){runCtrls.delete(ctl);ctl=null;}throw new Error("__cancel");}
      if(!full){
        /* 只有用户主动打断才叫取消；45秒超时的 aborted 得如实报出来，别伪装成"你取消了" */
        if(e&&e.name==="AbortError")throw new Error("__quiet");   /* 超时：不摆红字，就当这轮不想说话 */
        throw e;
      }
      /* 已经吐了一部分就先用已有的，不整段报错 */
      try{sysMsg("⚠️ 有一次回复中途断了，只出到一半（网络或模型服务抖动）");}catch(_){}
      try{console.warn("[三人行] 流式中断：",e&&e.message,"已收到",String(full||"").length,"字");}catch(_){}
    }
  }else{
    const data=await resp.json();
    usage=data.usage;
    const msg=data.choices?.[0]?.message||{};
    full=(msg.content&&msg.content.trim())||(msg.reasoning_content||"").replace(/\s+/g," ").slice(-60).trim()||"";
  }
  if(tmr){clearTimeout(tmr);tmr=null;}
  if(hard){clearTimeout(hard);hard=null;}
  if(ctl){runCtrls.delete(ctl);ctl=null;}
  if(usage)addSpend(useModel,usage);
  /* z107：字数到顶被硬掐时，最后一句往往是半截（「我今天去超市买了」）。
     回退到最后一个完整标点——宁可少说一句，也别露半句话。没有标点就原样留着（中文没标点时截哪都一样）。 */
  if(cutReason==="length"&&full){
    const m=String(full).match(/^[\s\S]*[。！？!?…~；;\n]/);
    if(m&&m[0].trim().length>=4)full=m[0].replace(/\s+$/,"");
  }
  return full.trim()||"(它回了个寂寞)";
}

}

    const src=a.type==="image"?a.dataUrl:(a.frames&&a.frames[0]);
    t.innerHTML=(src?`<img src="${src}">`:"🎬")
      +(a.type==="video"?`<span style="position:absolute;bottom:1px;left:3px;font-size:9px;background:#000c;padding:0 3px;border-radius:4px">×${a.frames.length}</span>`:"")
      +`<span class="rm" data-i="${i}">✕</span>`;
    t.querySelector(".rm").onclick=()=>{attachments.splice(i,1);renderAttachRow();};
    row.appendChild(t);
  });
}

function isVision(mo){return /VL|glm-4v|glm4v|glm-5|vision|InternVL|MiniCPM-V/i.test(String(mo));}
function attParts(atts){
  const parts=[];(atts||[]).forEach(a=>{
    if(a.type==="image")parts.push({type:"image_url",image_url:{url:a.dataUrl}});
    else if(a.frames)a.frames.forEach(f=>parts.push({type:"image_url",image_url:{url:f}}));
  });return parts;
}
/* z84：发图时先让"看图担当"看一眼、生成一句大白话转述，给看不了图的两位 */
async function describeImage(atts){
  try{
    const cands=privateWith?[privateWith]:members;
    const vis=cands.find(x=>x&&isVision(x.model)&&x.key&&x.url)||members.find(x=>x&&isVision(x.model)&&x.key&&x.url);
    if(!vis)return "";
    const parts=attParts(atts).slice(0,2);
    if(!parts.length)return "";
    const body={model:vis.model,messages:[{role:"user",content:[{type:"text",text:"用一句大白话说清这张图里是什么、有什么关键细节（人物、动作、表情、图上的字），40字以内；别评价、别抒情、别加戏。"},...parts]}],temperature:0.3,max_tokens:120};
    const r=await fetch(String(vis.url).replace(/\/$/,"")+"/chat/completions",{method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+vis.key},body:JSON.stringify(body)});
    if(!r.ok)return "";
    const j=await r.json();
    if(j.usage)addSpend(vis.model,j.usage);
    const txt=j.choices&&j.choices[0]&&j.choices[0].message?j.choices[0].message.content:"";
    return String(txt||"").trim().slice(0,100);
  }catch(e){return "";}
}
async function compressImage(file){
  const bmp=await createImageBitmap(file);
  const w=Math.min(bmp.width,800)||800,h=Math.max(1,Math.round(w*(bmp.height/bmp.width)));
  const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(bmp,0,0,w,h);
  if(bmp.close)bmp.close();return c.toDataURL("image/jpeg",0.75);
}
function videoFrames(file){
  return new Promise(resolve=>{
    const v=document.createElement("video");v.muted=true;v.playsInline=true;v.preload="auto";
    const url=URL.createObjectURL(file);v.src=url;
    const bail=()=>{URL.revokeObjectURL(url);resolve([]);};v.onerror=bail;
    v.onloadedmetadata=()=>{
      const dur=Math.max(v.duration||1,0.5);if(!isFinite(dur)){bail();return;}
      const times=[Math.min(0.2,dur),dur*0.45,dur*0.85].filter((t,i,arr)=>t<dur&&arr.indexOf(t)===i).slice(0,3);
      const frames=[];let i=0;
      v.onseeked=()=>{
        try{const ratio=v.videoWidth?(v.videoHeight/v.videoWidth):0.75;const w=Math.min(v.videoWidth||640,640);
          const h=Math.max(1,Math.round(w*ratio));const c=document.createElement("canvas");c.width=w;c.height=h;
          c.getContext("2d").drawImage(v,0,0,w,h);frames.push(c.toDataURL("image/jpeg",0.6));}catch(e){}
        if(++i>=times.length){URL.revokeObjectURL(url);resolve(frames);}else v.currentTime=times[i];
      };
      if(!times.length){bail();return;}v.currentTime=times[0];
    };
    setTimeout(()=>bail(),15000);
  });
}


async function send(){
  /* 正在思考时又发一句 = 直接打断上一轮，不等它跑完 */
  if(busy){runCtrls.forEach(c=>{try{c.__userAbort=true;c.abort();}catch(e){}});runCtrls.clear();runSeq++;}
  const myRun=++runSeq;
  const input=document.getElementById("inputBox"),text=input.value.trim();
  if(!text&&!attachments.length)return;
  const atts=attachments.slice();attachments=[];renderAttachRow();
  const targets=privateWith?[privateWith]:members.slice();
  let talkers=targets.filter(m=>m.key&&m.url&&m.model);
  if(!talkers.length){sysMsg("没人能说话：钥匙没配好，点上面那个框重新填一下。");return;}
  talkers.forEach(m=>preconnect(m.url));   /* z114：真发之前再确认一次连接已铺好 */
  if(atts.length){
    /* 发图时全家都能聊：能看图的真看图，看不了图的收到文字提示照常接话 */
    const v=targets.filter(m=>isVision(m.model)&&m.key);

  }
  sanitizeHistory();
  busy=true;input.value="";
  userMsg(text,atts);
  const status=document.getElementById("statusLine");
  if(privateWith){
    if(!Array.isArray(privateWith.private))privateWith.private=[];
    privateWith.private.push({role:"user",content:text||"(发了图片/视频)"});
    if(privateWith.private.length>40)privateWith.private.splice(0,privateWith.private.length-40);
    privateWith.history.push({role:"user",content:text||"(发了图片/视频)"});
    if(privateWith.history.length>10)privateWith.history.splice(0,privateWith.history.length-10);
  }else{
    members.forEach(m=>{m.history.push({role:"user",content:text||"(发了图片/视频)"});trimHist(m);});
  }
  save();

  /* z84：发图时先让看图担当看一眼，生成转述给其他两位 */
  let imgDesc="";
  if(atts.length){
    try{if(status)status.textContent="看一眼图…";}catch(e){}
    imgDesc=await describeImage(atts);
    try{if(status)status.textContent="";}catch(e){}
  }

  /* ===== 第一次见面：先把他认识清楚，再进正常聊天 ===== */
  if(!profile.done){
    if(text)profile.facts.push(text.slice(0,120));
    if(profile.step===0&&text){
      const nm=text.replace(/^(我叫|我是|叫|叫我)/,"").replace(/[，。,.!！?？\s].*$/,"").trim();
      if(nm&&nm.length<=12)profile.name=nm;
    }
    const q=INTRO_QS[Math.min(profile.step,INTRO_QS.length-1)];
    profile.step++;saveProfile();
    save();
    groupReset(members.filter(m=>m.key&&m.url&&m.model).map(m=>m.name));   /* z91：本轮三人轮流发言 */
    await Promise.all(members.filter(m=>m.key&&m.url&&m.model).map(async (m,__slot)=>{
      if(__slot>0)await new Promise(r=>setTimeout(r,__slot*120));   /* z104：初见也错峰，别一上来就打三个 */
      const lazy=aiMsgLazy(m);const sv=makeStreamView(m,lazy,m.name,false);
      try{
        const reply=await callModelNoRepeat(m,text||"你好",atts,{intro:q,emojiMode:pickEmojiMode(),packPick:pickPackCandidates(text||""),imgDesc:imgDesc},partial=>sv.push(partial));
        const sh=await sv.finish(reply);
        m.history.push({role:"assistant",content:reply});
        trimHist(m);
        save();
      }catch(e){
        if(sv){sv._done=true;groupPump();}
        if(e.message==="__cancel"){if(lazy.el&&!(sv&&sv.sent))try{lazy.el.remove();}catch(_){}}
        else if(e.message==="__quiet"){const sh=lazy.ensure();sh.bubble.innerHTML='<span class="quiet">……不想说话</span>';}
        else{
          try{console.warn("[小家] 初见没回上：",e&&e.message);}catch(_){}
          diagPush("初见没回上",e&&e.message);
          const sh=lazy.ensure();sh.bubble.innerHTML='<span class="quiet">……没接上话</span>';
          if(/额度|余额|欠费|重置|HTTP 40[123]/.test(String(e&&e.message||""))){
            try{sysMsg("⚠️ 接口没答应——key 的额度可能用完了，或这把钥匙失效了。详情："+String(e.message).slice(0,120));}catch(_){}
          }
        }
      }
    }));
    if(profile.step>=1){
      /* 只问了一句称呼，问完就算认识了。其余的东西等聊起来自然积累 */
      const nm=userName();
      sharedMem="他叫"+nm+"。\n关于他：（刚认识，还没聊多少）\n怎么跟他相处（重要）：叫他「"+nm+"」；像朋友一样聊天，保留他原本的说法、别过度替他改写；别急着结束对话；不评判他。";
      saveSharedMem();
      profile.done=true;saveProfile();
      sysMsg("记住了："+nm+"——以后就这么叫你。");
      setTimeout(()=>sysMsg("小提示：点一下你自己的头像，能换成你的照片——只存在你这台设备上，不上传任何地方。"),1200);
    }
    busy=false;
    return;
  }
  /* z89：不再自动切模型。只有你手动打开「深度思考」，才走人味大模型 + 认真提示词；
     平时一律快模型秒回，越短越有梗。isHeartfelt 只留一个用处：这句值不值得记进长期记忆。 */
  const heardFeeling=isHeartfelt(text);
  const heartfelt=!!deepThink;
  // 存记忆 / 存梗：心声里关于自己的写进共享记忆；非心声的闲聊梗词收进共享梗库
  if(heardFeeling&&text){
    /* 他讲的关于自己的事 → 长期事实区（压缩去重、不被冲掉）。跟开不开深度思考无关，都记 */
    addLongFact(text);
    sharedMem=sharedMem.replace(/\n?· 最近[^·\n]*(说了|提到)[^\n]*/g,"").trim();
    sharedMem+="\n· 最近他说："+text.slice(0,80);
    if(sharedMem.length>1500)sharedMem=MEM_SEED+"\n"+sharedMem.slice(-1200);
    saveSharedMem();
  }else if(/刷到|新梗|有趣的梗|好玩的梗|加个梗|加梗|收进梗库|进梗库/.test(text)){
    /* 只有用户明说"刷到梗/加个梗"才收进梗库，闲聊不再自动收录 */
    const picked=text.replace(/^.*[:：」"'”’]\s*/,"").trim();
    const meme=(picked&&picked.length<=30&&picked!==text)?picked:text.slice(0,30);
    addMeme(meme);
    sysMsg("📥 已收进梗库："+meme+"（只有你说「刷到/加梗」才收录）");
  }

  const usedMemes=[];
  const lowMood=!heartfelt&&isLowMood(text);  /* 状态不高：不整活 */
  /* 人设库全权决定：每人抽一个人设，抽中什么就按什么说话（只有"正常"拽梗） */
  let draws=talkers.map(m=>{
    const rp=privateWith?null:drawRP(lowMood?"soft":null);
    /* z72：梗不再被"正常"牌独占——每张牌都有机会拿一批候选梗，让模型按语境自己挑；认真/低情绪不发 */
    let myMemes=[];
    if(!heartfelt&&!lowMood&&text&&Math.random()<0.6){
      myMemes=pickMemeCandidates(text,usedMemes,6);
      myMemes.forEach(x=>{if(usedMemes.indexOf(x)<0)usedMemes.push(x);});
    }
    return {m,rp,myMemes};
  });
  /* ============================================================
     z111：群聊拆成两条物理隔离的通道，谁也不许抢谁的节奏
     ── 通道 B 接龙（有队形）：优先级最高。起头 → 台词按序 → 自由人，一句播完才轮到下一句
     ── 通道 A 正常说话：没人带队形，三人同一瞬间想，谁先想好谁先说
     以前两套混在一个 Promise.all 里跑：本地写死的台词比模型快得多，抢在起头前面出声，
     队形就散了（「你只是怕了」出来了，起头那句还没影）。现在按 formation 分岔，各走各的。
     ============================================================ */
  const owedCard=[];      /* 被顶掉牌的人，接龙时优先补自己的牌 */
  const pendingChain=[];  /* 人不够时没排上的接话，留到接龙补完（两人也能跑完整三连） */
  const chainLeads=draws.filter(d=>d.rp&&d.rp.chainTexts&&d.rp.chainTexts.length&&!heartfelt&&!privateWith);
  chainLeads.sort((a,b)=>b.rp.chainTexts.length-a.rp.chainTexts.length); /* 要人多的派系优先（如恐惧派） */
  const userLead=(!heartfelt&&!privateWith)?RPPOOL.find(r=>r.chainTexts&&r.userLead&&r.userLead.test(text)):null;
  /* 这一行决定走哪条通道：有队形=接龙，没队形=正常说话 */
  const formation=!!(userLead||chainLeads.length);

  /* 屏幕上真正播出去的句子。接龙只认这个——没播出来的，绝不许拿去接 */
  function playedWords(){
    return (groupPlayer.played||[]).map(x=>x.n+"："+x.t);
  }
  /* 接龙通道专用：说一句，等它完整播完才返回（下一个人才开口，绝不抢跑） */
  async function chainSay(d,free){
    const m=d.m,rp=d.rp,myMemes=d.myMemes||[];
    const lazy=aiMsgLazy(m);const sv=makeStreamView(m,lazy,m.name,rp&&/应声虫|复读/.test(rp.name||""));
    try{
      const saidNow=playedWords();
      const ctx={memes:free?myMemes:[],rp:rp,
        emojiMode:pickEmojiMode(),packPick:pickPackCandidates(text||""),imgDesc:imgDesc};
      if(free){   /* 自由接话：贴着屏幕上最后一句，别重复这轮说过的 */
        ctx.chain=true;
        ctx.lastLine=saidNow.length?saidNow[saidNow.length-1]:"";
        ctx.said=saidNow.slice(-6);
      }
      const reply=(rp&&rp.fixed)?rp.fixed:await callModelNoRepeat(m,free?"(接着群里的话，自然接一句)":text,atts,ctx,partial=>sv.push(partial));
      const sh=await sv.finish(reply);
      if(sh){sh.el.classList.add("spoke");setTimeout(()=>sh.el.classList.remove("spoke"),750);}
      m.history.push({role:"assistant",content:reply});trimHist(m);
      if(privateWith){
        privateWith.private.push({role:"assistant",content:reply});
        if(privateWith.private.length>40)privateWith.private.splice(0,privateWith.private.length-40);
      }else logFlow(m.name,reply);   /* 互相看见：记一份群流水 */
      save();
      return reply;
    }catch(e){
      if(sv){sv._done=true;groupPump();}
      if(e.message==="__cancel"){if(lazy.el&&!(sv&&sv.sent))try{lazy.el.remove();}catch(_){}}
      else if(e.message==="__quiet"){const sh=lazy.ensure();sh.bubble.innerHTML='<span class="quiet">……不想说话</span>';}
      else{
        try{console.warn("[小家] 这轮没回上：",e&&e.message);}catch(_){}
        diagPush("这轮没回上",e&&e.message);
        const sh=lazy.ensure();sh.bubble.innerHTML='<span class="quiet">……没接上话</span>';
        if(/额度|余额|欠费|重置|HTTP 40[123]/.test(String(e&&e.message||""))){
          try{sysMsg("⚠️ 接口没答应——key 的额度可能用完了，或这把钥匙失效了。详情："+String(e.message).slice(0,120));}catch(_){}
        }
      }
      return null;
    }
  }

  if(formation){
    /* ================= 通道 B：接龙（严格串行） ================= */
    let leadD=null;
    if(userLead){
      /* 用户自己起了头：他那句就是第一句，AI 直接按台词往下接 */
      const seat=draws.slice();
      userLead.chainTexts.forEach((t,i)=>{
        const txt=Array.isArray(t)?t[Math.floor(Math.random()*t.length)]:t;
        const o=seat[i];
        if(o){const owedRp=o.rp;o.rp={name:txt,fixed:txt,order:i};owedCard.push({m:o.m,rp:owedRp});}
        else pendingChain.push(txt);
      });
      seat.slice(userLead.chainTexts.length).forEach(o=>{o.rp=drawRP("chain");});
    }else{
      /* 有人抽到带台词的牌：他先说起头那句，其他人接台词 */
      leadD=chainLeads[0];
      const others=draws.filter(d=>d!==leadD);
      leadD.rp.chainTexts.forEach((t,i)=>{
        const txt=Array.isArray(t)?t[Math.floor(Math.random()*t.length)]:t;
        const o=others[i];
        if(o){const owedRp=o.rp;o.rp={name:txt,fixed:txt,order:i};owedCard.push({m:o.m,rp:owedRp});}
        else pendingChain.push(txt);
      });
    }
    groupReset(draws.map(d=>d.m.name));
    /* 座次只有一种：起头 → 台词按 order → 剩下的人 */
    const seatOrder=[];
    if(leadD)seatOrder.push({d:leadD,free:false});
    draws.filter(d=>d!==leadD&&d.rp&&d.rp.fixed)
      .sort((a,b)=>(a.rp.order||0)-(b.rp.order||0))
      .forEach(d=>seatOrder.push({d,free:false}));
    draws.filter(d=>d!==leadD&&!(d.rp&&d.rp.fixed)).forEach(d=>seatOrder.push({d,free:true}));
    for(let i=0;i<seatOrder.length;i++){
      if(myRun!==runSeq){status.textContent="";return;}   /* 被打断：这一轮立刻停 */
      await chainSay(seatOrder[i].d,seatOrder[i].free);
    }
  }else{
    /* ================= 通道 A：正常说话（同时想，谁快谁说，原样不动） ================= */
    groupReset(draws.map(d=>d.m.name));   /* z91：本轮轮流发言 */
    await Promise.all(draws.map(async ({m,rp,myMemes},__slot)=>{
      /* 三人同一时刻开始想，但请求之间留 120ms 微错峰，别撞服务端并发限制 */
      if(__slot>0)await new Promise(r=>setTimeout(r,__slot*120));
      const lazy=aiMsgLazy(m);const sv=makeStreamView(m,lazy,m.name,rp&&/应声虫|复读/.test(rp.name||""));
      try{
        const reply=(rp&&rp.fixed)?rp.fixed:await callModelNoRepeat(m,text,atts,{heartfelt:heartfelt,memes:myMemes||[],rp:rp,private:!!privateWith,soft:lowMood,emojiMode:pickEmojiMode(),packPick:pickPackCandidates(text||""),imgDesc:imgDesc},partial=>sv.push(partial));
        const sh=await sv.finish(reply);
        if(sh){sh.el.classList.add("spoke");setTimeout(()=>sh.el.classList.remove("spoke"),750);}
        m.history.push({role:"assistant",content:reply});
        trimHist(m);
        if(privateWith){
          privateWith.private.push({role:"assistant",content:reply});
          if(privateWith.private.length>40)privateWith.private.splice(0,privateWith.private.length-40);
        }else{
          logFlow(m.name,reply);   /* 互相看见：只记群流水，不往别人历史里塞"用户：某某: 话" */
        }
        save();
      }catch(e){
        if(sv){sv._done=true;groupPump();}
        if(e.message==="__cancel"){if(lazy.el&&!(sv&&sv.sent))try{lazy.el.remove();}catch(_){}}
        else if(e.message==="__quiet"){const sh=lazy.ensure();sh.bubble.innerHTML='<span class="quiet">……不想说话</span>';}
        else{
          try{console.warn("[小家] 这轮没回上：",e&&e.message);}catch(_){}
          diagPush("这轮没回上",e&&e.message);
          const sh=lazy.ensure();sh.bubble.innerHTML='<span class="quiet">……没接上话</span>';
          if(/额度|余额|欠费|重置|HTTP 40[123]/.test(String(e&&e.message||""))){
            try{sysMsg("⚠️ 接口没答应——key 的额度可能用完了，或这把钥匙失效了。详情："+String(e.message).slice(0,120));}catch(_){}
          }
        }
      }
    }));
  }
  if(myRun!==runSeq){status.textContent="";return;} /* 这一轮被打断了，不再接龙 */

  /* ===== 收尾补接龙：欠的台词、欠的牌必须出；没欠的就 30% 概率随便加一两句 ===== */
  let followUps=(!heartfelt&&talkers.length>1&&Math.random()<0.3)?1+Math.floor(Math.random()*2):0;
  const needMore=pendingChain.length+owedCard.length;
  if(!heartfelt&&needMore+1>followUps)followUps=needMore+1;
  let prev=null;
  for(let i=0;i<followUps;i++){
    if(myRun!==runSeq)break;   /* 被新消息打断就别再往下接龙 */
    let cand=talkers.filter(x=>x!==prev);
    if(!cand.length)break; /* 单独聊天时没人接龙，直接结束 */
    let sp,cRp;
    if(pendingChain.length){ /* 人不够，没排上的接话在这补完 */
      const pick=cand.length?cand:talkers;
      sp=pick[Math.floor(Math.random()*pick.length)];
      const txt=pendingChain.shift();cRp={name:txt,fixed:txt};
    }else if(owedCard.length){const owed=owedCard.shift();sp=owed.m;cRp=owed.rp||drawRP("chain");} /* 补上被顶掉的原牌 */
    else{sp=cand[Math.floor(Math.random()*cand.length)];cRp=drawRP("chain");}

    const saidNow=playedWords();
    const lastLine=saidNow.length?saidNow[saidNow.length-1]:"";
    let cMemes=[];
    if(!heartfelt&&Math.random()<0.6&&cRp){
      cMemes=pickMemeCandidates(lastLine||"",usedMemes,6);
      cMemes.forEach(x=>{if(usedMemes.indexOf(x)<0)usedMemes.push(x);});
    }
    const ok=await chainSay({m:sp,rp:cRp,myMemes:cMemes},!!(cRp&&!cRp.fixed));
    if(ok===null)break;
    prev=sp;
    await new Promise(r=>setTimeout(r,60+Math.random()*80));   /* 句间留一点呼吸，但不再死等一秒多 */
  }

  status.textContent="";
  // 共享记忆超长时整理一次（三人一起）
  const totalLines=members.reduce((a,m)=>a+histChars(m),0);
  if(totalLines>memLimit){
    status.textContent="🧠 正在整理共享记忆…";
    try{
      const ok=await distillMemory();
      if(ok)sysMsg(`🧠 把聊过的整理进了共享记忆，开启新对话。`,'memory');
    }catch(e){sysMsg(`🧠 这次没整理成功（${esc(e.message)}），下次再试。`);}
  }
  status.textContent="";busy=(myRun!==runSeq);
}

/* 全屏：第一次点屏幕时尝试进全屏，营造APP感（浏览器允许才生效） */
let fsTried=false;
function tryFullscreen(){
  if(fsTried)return;fsTried=true;
  const standalone=window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
  if(standalone)return;
  const el=document.documentElement;
  const fn=el.requestFullscreen||el.webkitRequestFullscreen;
  if(fn){try{const p=fn.call(el);if(p&&p.catch)p.catch(()=>{});}catch(e){}}
}
document.addEventListener("pointerdown",tryFullscreen,{once:true});
document.addEventListener("touchstart",tryFullscreen,{once:true});

/* 一次性迁移：梗库2026换血 + 三人模型统一为DeepSeek（最像人的那个）——必须在云端数据拉回之后跑，防止旧数据回流 */
const LS_MIG2="ai_mig_v3";
function migrateMemes(){
  try{
    if(localStorage.getItem(LS_MIG2))return false;
    localStorage.setItem(LS_MIG2,"1");
    localStorage.removeItem(LS_MEMES);
    localStorage.removeItem(LS_MEMES+"_recent");
    localStorage.setItem(LS_MEMES,JSON.stringify(SEED_MEMES.slice()));
    loadMemes();
    return true;
  }catch(e){return false;}
}
/* z69：妖精梗补进梗库——只补不删，保留用户手动加过的梗，只跑一次 */
const LS_MIG_MEMES="ai_mig_memes_v9";   /* z105：梗库又加了几条，版本升一级老用户才补得到 */
function migrateNewMemes(){
  try{
    if(localStorage.getItem(LS_MIG_MEMES))return false;
    localStorage.setItem(LS_MIG_MEMES,"1");
    let added=0;
    SEED_MEMES.forEach(s=>{if(sharedMemes.indexOf(s)<0){sharedMemes.push(s);added++;}});
    if(added)saveMemes();
    return added>0;
  }catch(e){return false;}
}
function migrateModels(){
  let changed=false;
  /* z87：三人统一走 MODEL_FAST，只有他讲心里话时才切 MODEL_HEART。
     DeepSeek-V4-Pro / Kimi-K2.6 试过一轮：人味没明显更好，但慢一倍、贵十倍，已弃用。
     教训（z85）：MiniMax-M2.5 已于 2026-09-11 下线、Step-3.5-Flash 已于 2026-11-16 下线，选了就 403。
     换模型前必须先去 docs.siliconflow.cn 的「更新公告」核实是否还在架；价格页/第三方目录会滞后。
     z86 已删掉"模型不可用自动降级"，现在模型调不通就如实报红字（要知道真相，不要被蒙）。 */
  const MODEL_OF={Nyx:MODEL_FAST,Vesta:MODEL_FAST,Demeter:MODEL_FAST};
  /* z78：三人改名 —— 旧名换新名；同时把存档里旧人设(写着GPT/Claude/DeepSeek自称的)换成新版，模型ID与头像key不动 */
  const RN={"GPT":"Nyx","Claude":"Vesta","DeepSeek":"Demeter"};
  const KEY_OF={"Nyx":"gpt","Vesta":"claude","Demeter":"deepseek","GPT":"gpt","Claude":"claude","DeepSeek":"deepseek"};
  const AV_OF={gpt:"img:gpt|gpt_bust2.webp",claude:"img:claude|claude_bust2.webp",deepseek:"img:deepseek|deepseek_bust2.webp"};
  const PK={gpt:PERSONA_GPT,claude:PERSONA_CLAUDE,deepseek:PERSONA_DEEPSEEK};
  members.forEach(m=>{
    if(RN[m.name]){m.name=RN[m.name];changed=true;}
    const key=KEY_OF[m.name]||null;   /* 按名字认人：老存档头像哪怕是base64内嵌图也能刷 */
    if(key){
      if(m.persona!==PK[key]){m.persona=PK[key];changed=true;}
      if(m.avatar!==AV_OF[key]){m.avatar=AV_OF[key];changed=true;}   /* 强制指向新头像文件 */
    }
    const want=MODEL_OF[m.name];
    if(want&&m.model!==want){m.model=want;changed=true;}
  });
  return changed;
}
/* z78：老存档里聊天记录前缀写着旧名字的，也换掉，免得记录里还是"GPT: xxx" */
function migrateOldNames(){
  try{
    if(localStorage.getItem("ai_mig_names_v1"))return false;
    localStorage.setItem("ai_mig_names_v1","1");
    const RN={"GPT":"Nyx","Claude":"Vesta","DeepSeek":"Demeter"};
    let changed=false;
    members.forEach(m=>{
      (m.history||[]).forEach(h=>{
        if(h.role==="user"&&typeof h.content==="string"){
          const nv=h.content.replace(/^(GPT|Claude|DeepSeek):/g,function(_,x){return RN[x]+":";});
          if(nv!==h.content){h.content=nv;changed=true;}
        }
      });
    });
    if(changed)save();
    return changed;
  }catch(e){return false;}
}

(async function start(){
  load();
  if(!KEY){

    if(!KEY){const ik=await idbGet("key");if(ik&&ik.indexOf("sk-")===0)saveKey(ik);}   // 再一层：IndexedDB
    /* 开源版：每台设备只认本机填过的钥匙，不从站点或网址取，谁也蹭不到作者额度 */
    if(KEY)writeKeyEverywhere(KEY);
  }
  /* 每台设备只用这台设备自己填的钥匙：不留在任何一格是别人的（避免代码某个角落把别人的额度带上来） */
  if(KEY)members.forEach(m=>{m.key=KEY;});

      "<br>地址带钥匙："+(hk==="有"?"<b style='color:#ff7b72'>有(不安全，请删掉?k=参数)</b>":"<b style='color:#7ee787'>无</b>")+"　·　本机：<b style='color:"+(lk==="有"?"#7ee787":"#ff7b72")+"'>"+lk+"</b>　·　cookie：<b style='color:"+(ck==="有"?"#7ee787":"#ff7b72")+"'>"+ck+"</b>　·　本机备份：<b style='color:"+(lk==="有"?"#7ee787":"#ff7b72")+"'>"+(lk==="有"?"已存":"未存")+"</b>";
  }catch(e){}
  if(!KEY){document.getElementById("keyOverlay").classList.add("show");}
  else if(!profile.done)sysMsg("随便说句话，她们先问你叫什么。");
  else sysMsg("它们记得你。说句话试试～");
})();
